<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mission families - Satellite Data Catalog</title>
<link rel="stylesheet" href="static/style.css?v=3">
<script>(function(){var t=localStorage.getItem('satcat-theme')||'dark';document.documentElement.setAttribute('data-theme',t);})();</script>
<link rel="icon" href="data:,">
</head>
<body>
<header class="topbar">
  <a class="brand" href="index.html">🛰️ Satellite Data Catalog <span class="mirror-badge">public mirror</span></a>
  <nav><a href="wiki.html">Wiki</a> <a href="families.html">Families</a></nav>
</header>
<main class="container">
  <h1>Mission families</h1>
  <p class="hint">Missions grouped by series/generation. Satellites with multiple processing levels open a level picker first.</p>
  <div id="families-container"><p class="result-count">Loading…</p></div>

  <div id="compare-bar" class="compare-bar">
    <span id="compare-bar-text"></span>
    <button type="button" id="compare-bar-view" class="btn btn-small">View comparison</button>
    <button type="button" id="compare-bar-clear" class="icon-btn">✕</button>
  </div>
</main>

<script src="static/config.js?v=2"></script>
<script src="https://cdn.jsdelivr.net/npm/js-yaml@4.1.0/dist/js-yaml.min.js"></script>
<script src="static/catalog.js?v=5"></script>
<script>

function esc(s) { return (s === null || s === undefined) ? '' : String(s); }

function flatCardHtml(d) {
  var verifiedBadge = d.verification_status === 'verified'
    ? '<span class="badge verified-badge">\u2714 verified</span>'
    : '<span class="badge unverified-badge">\u25d0 unverified</span>';
  var attentionBadge = (d._missing && d._missing.length) ? '<span class="badge attention-badge">\u26a0 incomplete</span>' : '';
  return '<div class="card-wrap">' +
    '<label class="compare-check"><input type="checkbox" class="compare-checkbox" value="' + d.id + '"></label>' +
    '<a class="card" href="dataset.html?id=' + encodeURIComponent(d.id) + '"><div class="card-body">' +
    '<div class="card-header"><span class="badge status-' + d.status.toLowerCase().replace(/ /g,'-') + '">' + d.status + '</span>' + verifiedBadge + attentionBadge + '</div>' +
    '<h3>' + d.mission_name + (d.sensor_name ? ' <span class="sensor">/ ' + d.sensor_name + '</span>' : '') + '</h3>' +
    '<p class="agency">' + (d.agency||'') + (d.launch_year ? ' \u00b7 since ' + d.launch_year : '') + '</p>' +
    '<p class="short-desc">' + (d.short_description||'') + '</p></div></a></div>';
}

function satelliteCardHtml(sat, folder, levelCount) {
  return '<a class="card satellite-card" href="satellite.html?folder=' + encodeURIComponent(folder) + '">' +
    '<div class="card-body">' +
    '<div class="card-header"><span class="badge status-' + esc(sat.status).toLowerCase().replace(/ /g,'-') + '">' + esc(sat.status) + '</span>' +
    '<span class="badge level-count-badge">' + levelCount + ' level' + (levelCount !== 1 ? 's' : '') + '</span></div>' +
    '<h3>' + esc(sat.mission_name) + (sat.sensor_name ? ' <span class="sensor">/ ' + esc(sat.sensor_name) + '</span>' : '') + '</h3>' +
    '<p class="agency">' + esc(sat.agency) + (sat.launch_year ? ' \u00b7 since ' + sat.launch_year : '') + '</p>' +
    '<p class="short-desc">' + esc(sat.short_description) + '</p></div></a>';
}

loadCatalog().then(function (catalog) {
  renderLoadErrorsBanner(document.querySelector('main.container'));
  var groups = {};
  catalog.forEach(function (d) {
    var key = (d.mission_family || '').trim() || 'Ungrouped';
    groups[key] = groups[key] || [];
    groups[key].push(d);
  });
  var keys = Object.keys(groups).sort(function (a, b) {
    if (a === 'Ungrouped') return 1; if (b === 'Ungrouped') return -1; return a.localeCompare(b);
  });

  var selected = new URLSearchParams(window.location.search).get('name');
  var container = document.getElementById('families-container');

  if (selected) {
    document.querySelector('main.container').insertBefore(
      (function () { var a = document.createElement('a'); a.href = 'families.html'; a.className = 'back-link'; a.textContent = '\u2190 All families'; return a; })(),
      document.querySelector('h1')
    );
    if (!groups[selected]) {
      container.innerHTML = '<p class="hint">No family named "' + selected + '".</p>';
    } else {
      var grouped = groupBySatellite(groups[selected]);
      grouped.flat.sort(function (a, b) { return (a.launch_year||0) - (b.launch_year||0); });
      grouped.satellites.sort(function (a, b) { return a.folder.localeCompare(b.folder); });

      container.innerHTML = '<section><h2>' + selected + '</h2><div class="card-grid" id="family-cards"></div></section>';
      var cardsEl = document.getElementById('family-cards');
      cardsEl.innerHTML = grouped.flat.map(flatCardHtml).join('');
      wireCompareCheckboxes();

      Promise.all(grouped.satellites.map(function (g) {
        return loadSatelliteInfo(g.folder).then(function (sat) {
          return { sat: sat, folder: g.folder, count: g.levels.length };
        }).catch(function (err) {
          console.error('[satcat] could not load satellite info for', g.folder, err);
          return null;
        });
      })).then(function (results) {
        results.filter(Boolean).forEach(function (r) {
          cardsEl.insertAdjacentHTML('afterbegin', satelliteCardHtml(r.sat, r.folder, r.count));
        });
      });
    }
  } else {
    container.innerHTML = '<div class="family-directory">' + keys.map(function (fam) {
      return '<a class="family-directory-item" href="families.html?name=' + encodeURIComponent(fam) + '">' +
        '<strong>' + fam + '</strong><span class="qa-meta">' + groups[fam].length + ' mission' + (groups[fam].length !== 1 ? 's' : '') + '</span></a>';
    }).join('') + '</div>';
  }
}).catch(function (err) {
  document.getElementById('families-container').innerHTML = '<p>Failed to load catalog.</p>';
  console.error(err);
});
</script>
</body>
</html>
