id: landsat-2-mss
mission_name: Landsat 2
sensor_name: MSS (Multispectral Scanner)
agency: NASA / USGS
mission_family: Landsat
status: Decommissioned
launch_year: 1975
end_of_life_year: 1982
short_description: Second Landsat satellite, near-identical to Landsat 1, extending the MSS archive and
  providing early revisit overlap for change detection.
long_description: Landsat 2 carried the same RBV and MSS instrument package as Landsat 1 and was launched
  to maintain continuity of the archive while Landsat 1 was still operating, giving the program its first
  multi-satellite overlap and effectively doubling revisit frequency during that period.
