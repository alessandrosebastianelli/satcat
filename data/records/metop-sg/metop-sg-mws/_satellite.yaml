short_description: 24-channel microwave sounder (23.8-229 GHz) combining AMSU-A and MHS capabilities with
  new 118 GHz and 229 GHz channels.
long_description: 'MWS replaces AMSU-A and MHS on Metop-SG-A: it covers temperature sounding near 50-57
  GHz and 118.75 GHz, humidity near 183 GHz, and window channels from 23.8 to 229 GHz in a 2200 km swath.
  Metop-SG-A1 was launched on 13 August 2025; Metop-SG-B1 is planned for launch in late 2026 (check EUMETSAT
  for the current date). Product collections and formats are still being introduced, so look them up in
  the Data Store.'
instrument_type: Passive microwave sounder (24 channels)
orbit_type: LEO sun-synchronous (about 830 km, 09:30 descending node)
