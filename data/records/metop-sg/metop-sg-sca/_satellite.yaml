mission_name: Metop-SG (Metop Second Generation)
sensor_name: SCA (Scatterometer)
agency: EUMETSAT / ESA
mission_family: Metop-SG
status: Planned
launch_year: 2026
end_of_life_year: null
short_description: C-band (5.355 GHz) scatterometer for ocean winds and land backscatter, successor of
  ASCAT, on Metop-SG-B.
long_description: SCA flies on Metop-SG-B and uses six antennas in two swaths to improve coverage and
  resolution relative to ASCAT, adding cross-polarised measurements that help retrieve strong winds in
  storms. Metop-SG-A1 was launched on 13 August 2025; Metop-SG-B1 is planned for launch in late 2026 (check
  EUMETSAT for the current date). Product collections and formats are still being introduced, so look
  them up in the Data Store.
instrument_type: Active microwave - C-band scatterometer
orbit_type: LEO sun-synchronous (about 830 km, 09:30 descending node)
