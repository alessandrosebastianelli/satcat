mission_name: Metop-SG (Metop Second Generation)
sensor_name: IASI-NG (Infrared Atmospheric Sounding Interferometer - New Generation)
agency: EUMETSAT / ESA
mission_family: Metop-SG
status: Active
launch_year: 2025
end_of_life_year: null
short_description: Next-generation hyperspectral infrared sounder with twice the spectral resolution and
  about half the noise of IASI.
long_description: IASI-NG, built by CNES, covers 645-2760 cm-1 with 0.25 cm-1 spectral resolution and
  a 12 km footprint, improving vertical resolution and sensitivity to trace gases compared with IASI.
  It flies on Metop-SG-A. Metop-SG-A1 was launched on 13 August 2025; Metop-SG-B1 is planned for launch
  in late 2026 (check EUMETSAT for the current date). Product collections and formats are still being
  introduced, so look them up in the Data Store.
instrument_type: Hyperspectral infrared sounder (Fourier-transform interferometer)
orbit_type: LEO sun-synchronous (about 830 km, 09:30 descending node)
