mission_name: Metop-SG (Metop Second Generation)
sensor_name: RO (Radio Occultation)
agency: EUMETSAT / ESA
mission_family: Metop-SG
status: Active
launch_year: 2025
end_of_life_year: null
short_description: GNSS radio occultation receiver providing high-vertical-resolution temperature and
  humidity profiles, on Metop-SG-A and -B.
long_description: The RO instrument tracks GPS, Galileo, GLONASS and BeiDou signals, measuring how the
  atmosphere bends them to derive refractivity, temperature and humidity with high accuracy and vertical
  resolution. It is carried on both Metop-SG-A and -B. Metop-SG-A1 was launched on 13 August 2025; Metop-SG-B1
  is planned for launch in late 2026 (check EUMETSAT for the current date). Product collections and formats
  are still being introduced, so look them up in the Data Store.
instrument_type: GNSS radio occultation receiver
orbit_type: LEO sun-synchronous (about 830 km, 09:30 descending node)
