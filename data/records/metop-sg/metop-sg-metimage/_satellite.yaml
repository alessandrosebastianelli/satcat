mission_name: Metop-SG (Metop Second Generation)
sensor_name: MetImage (Meteorological Imager)
agency: EUMETSAT / ESA
mission_family: Metop-SG
status: Active
launch_year: 2025
end_of_life_year: null
short_description: 20-channel visible-to-thermal imager (443 nm to 13.3 um) with 500 m sampling and a
  2670 km swath, successor of AVHRR on Metop-SG-A.
long_description: MetImage (also called VII) is the high-resolution imager of Metop-SG-A. It covers 443
  nm to 13.3 um in 20 channels and provides clouds, SST, land surface and snow information; it continues
  AVHRR and complements VIIRS. Metop-SG-A1 was launched on 13 August 2025; Metop-SG-B1 is planned for
  launch in late 2026 (check EUMETSAT for the current date). Product collections and formats are still
  being introduced, so look them up in the Data Store.
instrument_type: Optical - Multispectral + thermal imager (20 channels)
orbit_type: LEO sun-synchronous (about 830 km, 09:30 descending node)
