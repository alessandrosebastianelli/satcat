id: landsat-6-etm
mission_name: Landsat 6
sensor_name: ETM (Enhanced Thematic Mapper)
agency: NASA / USGS
mission_family: Landsat
status: Decommissioned
launch_year: 1993
end_of_life_year: 1993
short_description: >-
  Failed to reach orbit — included here only for archive completeness of
  the Landsat series numbering.
long_description: >-
  Landsat 6 was lost due to a launch vehicle failure in October 1993 and
  never reached orbit. It carried the Enhanced Thematic Mapper (ETM),
  which added a 15 m panchromatic band to the TM design — a feature later
  carried forward (in improved form) on Landsat 7's ETM+. No data exists
  from this mission; the record exists purely to keep the family listing
  complete and to explain the numbering gap between Landsat 5 and 7.
