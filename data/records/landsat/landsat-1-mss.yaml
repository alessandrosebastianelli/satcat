id: landsat-1-mss
mission_name: Landsat 1
sensor_name: MSS (Multispectral Scanner)
agency: NASA / USGS
mission_family: Landsat
status: Decommissioned
launch_year: 1972
end_of_life_year: 1978
short_description: First Earth observation satellite of the Landsat program (originally named ERTS-1),
  carrying the first Multispectral Scanner (MSS).
long_description: Landsat 1 (launched as ERTS-1, Earth Resources Technology Satellite) was the first civilian
  Earth observation satellite, opening the longest continuous archive of moderate-resolution land imagery
  in existence. It carried a Return Beam Vidicon (RBV) camera and the MSS, with MSS becoming the primary
  instrument for the whole early Landsat series. Its ~80 m resolution was groundbreaking for the time
  and established many of the land-monitoring use cases (agriculture, forestry, geology) still core to
  Landsat today.
