notes: Historical archive only, useful for long-term change detection baselines (e.g. comparing land cover
  50+ years apart). Geolocation accuracy is much lower than modern Landsat — expect to co-register manually.
known_limitations: Low radiometric resolution (6 bit) and coarse ~79 m pixels; RBV camera data has limited
  availability compared to MSS.
example_use_cases: Multi-decadal land cover change studies when paired with Landsat 8/9.
