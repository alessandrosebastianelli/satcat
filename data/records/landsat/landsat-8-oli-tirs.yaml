gee_snippet: "var collection = ee.ImageCollection('LANDSAT/LC08/C02/T1_L2')\n  .filterBounds(ee.Geometry.Point([12.5,\
  \ 41.9]))\n  .filterDate('2024-06-01', '2024-08-31')\n  .filter(ee.Filter.lt('CLOUD_COVER', 20));\n\
