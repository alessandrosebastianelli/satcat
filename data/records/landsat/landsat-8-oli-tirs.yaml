short_description: Two-instrument push-broom sensor (OLI for reflective bands, TIRS for thermal) with
  improved SNR and 12-bit radiometry over earlier Landsats.
long_description: 'Landsat 8 introduced a push-broom design (vs the whisk-broom scanning of earlier Landsats),
  split across two instruments: OLI (Operational Land Imager) for the visible/NIR/SWIR/panchromatic bands,
  and TIRS (Thermal Infrared Sensor) for two thermal bands. It added a coastal/aerosol band and a cirrus-detection
  band not present on Landsat 7, and improved radiometric resolution to 12 bit, giving much better sensitivity
  in dark targets (water, shadow) than the 8-bit TM/ETM+ series.'
