notes: Collection 2 Level-2 products come with QA_PIXEL cloud/shadow masks — always apply them before
  compositing. Coverage stops around ±81° latitude — a real orbital/tiling-grid limit (not a metadata
  gap), so true polar ice sheets fall outside the systematic acquisition mask.
known_limitations: TIRS has a known stray-light issue affecting some thermal band calibration; USGS provides
  correction guidance.
example_use_cases: General-purpose 30m land monitoring, NDVI time series, LST retrieval.
