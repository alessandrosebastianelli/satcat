short_description: Eleven-band optical and thermal imager at 30 m (thermal 100 m), the current reference
  for medium-resolution land monitoring.
long_description: Landsat 9 was launched on 27 September 2021 and is a near-copy of Landsat 8 with OLI-2
  (14-bit radiometry, improving dynamic range over dark and bright targets) and TIRS-2 (improved stray-light
  performance). Together with Landsat 8 it provides an 8-day global revisit.
