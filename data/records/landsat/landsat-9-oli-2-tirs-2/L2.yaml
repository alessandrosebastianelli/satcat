snippets:
- title: Python
  lang: python
  description: Searches the Microsoft Planetary Computer STAC catalogue (no account needed), picks the
    least cloudy scene and plots NDVI from the surface-reflectance bands.
  requirements:
  - pystac-client
  - planetary-computer
  - rioxarray
  - matplotlib
  code: |
    import matplotlib.pyplot as plt
    import numpy as np
    import planetary_computer
    import pystac_client
    import rioxarray

    catalog = pystac_client.Client.open(
        "https://planetarycomputer.microsoft.com/api/stac/v1",
        modifier=planetary_computer.sign_inplace,
    )


    def open_overview(href, level=2):
        """Open a COG at reduced resolution (fast), falling back to full resolution."""
        try:
            return rioxarray.open_rasterio(href, overview_level=level, masked=True).squeeze()
        except Exception:
            return rioxarray.open_rasterio(href, masked=True).squeeze()

    search = catalog.search(
        collections=["landsat-c2-l2"],
        bbox=[12.4, 41.8, 12.6, 42.0],                      # Rome - change to your area
        datetime="2023-06-01/2023-08-31",
        query={"platform": {"eq": "landsat-9"}, "eo:cloud_cover": {"lt": 30}},
    )
    items = search.item_collection()
    if not items:
        raise SystemExit("No scenes found - widen the dates or the bounding box")
    item = min(items, key=lambda i: i.properties.get("eo:cloud_cover", 100))
    print(len(items), "scenes found; using", item.id, item.datetime)
    print("assets:", sorted(item.assets))

    # Collection 2 Level-2 scale factors: reflectance = DN * 0.0000275 - 0.2
    red = open_overview(item.assets["red"].href) * 0.0000275 - 0.2
    nir = open_overview(item.assets["nir08"].href) * 0.0000275 - 0.2
    ndvi = (nir - red) / (nir + red)
    ndvi.plot(cmap="YlGn", vmin=-0.2, vmax=0.9)
    plt.title("NDVI - " + item.id)
    plt.show()
- title: Google Earth Engine
  lang: javascript
  code: |2
            // Landsat 9 Collection 2 Level-2: surface reflectance and surface temperature
            var aoi = ee.Geometry.Point([12.5, 41.9]);

            var collection = ee.ImageCollection('LANDSAT/LC09/C02/T1_L2')
              .filterBounds(aoi)
              .filterDate('2023-06-01', '2023-08-31')
              .sort('CLOUD_COVER');

            print('Scenes:', collection.size());
            var image = ee.Image(collection.first());

            // Collection 2 Level-2 scale factors
            var optical = image.select('SR_B.').multiply(0.0000275).add(-0.2);
            Map.centerObject(aoi, 9);
            Map.addLayer(optical, {bands: ['SR_B4', 'SR_B3', 'SR_B2'], min: 0, max: 0.3}, 'Surface reflectance');
    var st = image.select('ST_B10').multiply(0.00341802).add(149.0).subtract(273.15);
    Map.addLayer(st, {min: 10, max: 50, palette: ['blue', 'white', 'red']}, 'Surface temperature (C)');
- title: Original Method
  lang: bash
  description: Official USGS distribution. EarthExplorer and the M2M API need a free USGS account; the
    AWS bucket is requester-pays.
  code: |
    # Landsat 9 OLI/TIRS Level-2
    # USGS Collection 2 archive on AWS (requester-pays bucket: needs an AWS account).
    # Path/row 191/031 is Rome (WRS-2) - find yours on https://landsat.usgs.gov/landsat_acq
    aws s3 ls --request-payer requester s3://usgs-landsat/collection02/level-2/standard/oli-tirs/2023/191/031/
    aws s3 cp --request-payer requester --recursive \
      s3://usgs-landsat/collection02/level-2/standard/oli-tirs/2023/191/031/SCENE_ID/ ./SCENE_ID/

    # Free alternative without AWS: search and download from EarthExplorer
    # https://earthexplorer.usgs.gov  (free USGS ERS account) or the M2M API:
    # https://m2m.cr.usgs.gov/
