notes: 'Scale factors: reflectance = DN x 0.0000275 - 0.2; surface temperature (K) = DN x 0.00341802 +
  149.0. Use QA_PIXEL to mask cloud, shadow and snow.'
known_limitations: Surface temperature uses an emissivity estimate from ASTER GED and reanalysis profiles;
  it is less accurate over bare soil and in humid conditions.
example_use_cases: Vegetation indices; land surface temperature and urban heat; time series combined with
  Sentinel-2 (harmonised).
