id: landsat-3-mss-l1
level: L1
level_summary: 'Level 1 (Collection 2): geometrically corrected, calibrated digital numbers with scale
  factors in the metadata. MSS has no surface-reflectance Level-2 product.'
bands:
- name: B4 - Green
  wavelength_or_frequency: 550 nm
  spatial_resolution: 60 m (resampled from 79-82 m)
  wavelength_nm: 550
  bandwidth_nm: 100.0
  resolution_m: 60.0
  typical_use: Sediment-laden water, vegetation vigour
- name: B5 - Red
  wavelength_or_frequency: 650 nm
  spatial_resolution: 60 m (resampled from 79-82 m)
  wavelength_nm: 650
  bandwidth_nm: 100.0
  resolution_m: 60.0
  typical_use: Vegetation discrimination, cultural features
- name: B6 - Near infrared 1
  wavelength_or_frequency: 750 nm
  spatial_resolution: 60 m (resampled from 79-82 m)
  wavelength_nm: 750
  bandwidth_nm: 100.0
  resolution_m: 60.0
  typical_use: Vegetation boundaries, water/land
- name: B7 - Near infrared 2
  wavelength_or_frequency: 950 nm
  spatial_resolution: 60 m (resampled from 79-82 m)
  wavelength_nm: 950
  bandwidth_nm: 300.0
  resolution_m: 60.0
  typical_use: Vegetation, water penetration limits
spatial_resolution_summary: 60 m (resampled from the native 79-82 m pixel)
processing_level:
- L1
derivable_products:
- NDVI-like indices (near infrared vs red)
- Land cover change baselines
- Forest/agriculture history
