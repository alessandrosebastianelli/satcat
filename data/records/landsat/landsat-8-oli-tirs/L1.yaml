snippets:
- title: Python
  lang: python
  description: Level-1 top-of-atmosphere reflectance through the Earth Engine Python API. Needs a Google
    account with Earth Engine access; the notebook asks for your Cloud project ID.
  requirements:
  - earthengine-api
  code: |
    import ee
    from IPython.display import Image, display

    # One-off sign-in with a Google account that has Earth Engine access
    ee.Authenticate()
    PROJECT = input("Google Cloud project ID registered for Earth Engine: ")
    ee.Initialize(project=PROJECT)

    point = ee.Geometry.Point([12.5, 41.9])           # Rome - change to your area
    collection = (
        ee.ImageCollection("LANDSAT/LC08/C02/T1_TOA")
        .filterBounds(point)
        .filterDate("2023-06-01", "2023-08-31")
        .sort("CLOUD_COVER")
    )
    print("scenes:", collection.size().getInfo())
    image = ee.Image(collection.first())
    print("least cloudy scene:", image.get("system:index").getInfo(), "cloud cover:", image.get("CLOUD_COVER").getInfo())

    url = image.select(['B4', 'B3', 'B2']).getThumbURL({
        "min": 0, "max": 0.3, "dimensions": 900,
        "region": point.buffer(30000).bounds(),
    })
    display(Image(url=url))
- title: Google Earth Engine
  lang: javascript
  code: |
    // Landsat 8 OLI top-of-atmosphere reflectance (true colour)
    var aoi = ee.Geometry.Point([12.5, 41.9]);

    var collection = ee.ImageCollection('LANDSAT/LC08/C02/T1_TOA')
      .filterBounds(aoi)
      .filterDate('2023-06-01', '2023-08-31')
      .sort('CLOUD_COVER');

    print('Scenes:', collection.size());
    var image = ee.Image(collection.first());
    Map.centerObject(aoi, 9);
    Map.addLayer(image, {bands: ['B4', 'B3', 'B2'], min: 0, max: 0.3}, 'Least cloudy scene');
- title: Original Method
  lang: bash
  description: Official USGS distribution. EarthExplorer and the M2M API need a free USGS account; the
    AWS bucket is requester-pays.
  code: |
    # Landsat 8 OLI/TIRS Level-1
    # USGS Collection 2 archive on AWS (requester-pays bucket: needs an AWS account).
    # Path/row 191/031 is Rome (WRS-2) - find yours on https://landsat.usgs.gov/landsat_acq
    aws s3 ls --request-payer requester s3://usgs-landsat/collection02/level-1/standard/oli-tirs/2023/191/031/
    aws s3 cp --request-payer requester --recursive \
      s3://usgs-landsat/collection02/level-1/standard/oli-tirs/2023/191/031/SCENE_ID/ ./SCENE_ID/

    # Free alternative without AWS: search and download from EarthExplorer
    # https://earthexplorer.usgs.gov  (free USGS ERS account) or the M2M API:
    # https://m2m.cr.usgs.gov/
related_datasets:
