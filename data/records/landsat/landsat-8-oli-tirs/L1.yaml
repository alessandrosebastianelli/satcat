- sentinel-2-msi-l2a
internal_projects: Not yet used in a specific internal project - flag here once it is.
notes: Collection 2 Level-1 comes in Tier 1 (best geometric/radiometric quality, use for time series),
  Tier 2 and Real-Time (RT). Prefer Tier 1. Landsat 8 and 9 are radiometrically cross-calibrated.
known_limitations: 'Optical and thermal sensor: no data under clouds. TIRS has residual stray-light effects,
  mostly corrected in Collection 2; B11 is less reliable than B10 for split-window work.'
example_use_cases: Crop monitoring; urban expansion; coastal change; fire severity (NBR); pan-sharpened
  mapping at 15 m.
