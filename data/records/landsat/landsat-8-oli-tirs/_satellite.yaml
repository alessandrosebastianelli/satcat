short_description: Eleven-band optical and thermal imager at 30 m (thermal 100 m), the current reference
  for medium-resolution land monitoring.
long_description: Landsat 8 was launched on 11 February 2013 and carries the Operational Land Imager (OLI,
  9 bands including a coastal aerosol and a cirrus band) and the Thermal Infrared Sensor (TIRS, 2 bands).
  With Landsat 9 it provides a global revisit of 8 days. It is the backbone of current medium-resolution
  land monitoring and is fully compatible with Sentinel-2 through harmonisation.
