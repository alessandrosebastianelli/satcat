short_description: Four-band multispectral scanner (green to near infrared) of Landsat 1, part of the
  oldest continuous satellite land record.
long_description: Landsat 1 (originally ERTS-1) was launched on 23 July 1972 and was the first satellite
  dedicated to monitoring Earth's land. It carried the Multispectral Scanner (MSS, four bands from green
  to near infrared at about 79 m) and the Return Beam Vidicon cameras, and operated until January 1978.
