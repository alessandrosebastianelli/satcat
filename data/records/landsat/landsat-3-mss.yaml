id: landsat-3-mss
mission_name: Landsat 3
sensor_name: MSS (Multispectral Scanner)
agency: NASA / USGS
mission_family: Landsat
status: Decommissioned
launch_year: 1978
end_of_life_year: 1983
short_description: Third Landsat satellite, added a thermal infrared band to the MSS instrument (later
  disabled due to a technical issue).
long_description: Landsat 3 continued the MSS-era archive and experimented with a fifth, thermal infrared
  MSS band, which was disabled shortly after launch due to a data formatting problem — most Landsat 3
  MSS data in the archive is therefore the standard 4-band set, same as Landsat 1/2.
instrument_type: Optical - Multispectral
