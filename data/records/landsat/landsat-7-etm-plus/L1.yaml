id: landsat-7-etm-plus-l1
level: L1
level_summary: 'Level 1 (Collection 2): calibrated digital numbers (Tier 1 / Tier 2 / RT) with conversion
  coefficients in the metadata. Scenes after May 2003 are SLC-off.'
