id: landsat-5-tm-l1
level: L1
level_summary: 'Level 1 (Collection 2): geometrically and radiometrically calibrated digital numbers (Tier
  1 / Tier 2 / RT), with metadata to convert to radiance or TOA reflectance.'
bands:
- name: B1 - Blue
  wavelength_or_frequency: 485 nm
  spatial_resolution: 30 m
  wavelength_nm: 485
  bandwidth_nm: 70.0
  resolution_m: 30.0
  typical_use: Water penetration, soil/vegetation
- name: B2 - Green
  wavelength_or_frequency: 560 nm
  spatial_resolution: 30 m
  wavelength_nm: 560
  bandwidth_nm: 80.0
  resolution_m: 30.0
  typical_use: Vegetation vigour
- name: B3 - Red
  wavelength_or_frequency: 660 nm
  spatial_resolution: 30 m
  wavelength_nm: 660
  bandwidth_nm: 60.0
  resolution_m: 30.0
  typical_use: Chlorophyll absorption, NDVI red
- name: B4 - NIR
  wavelength_or_frequency: 830 nm
  spatial_resolution: 30 m
  wavelength_nm: 830
  bandwidth_nm: 140.0
  resolution_m: 30.0
  typical_use: Biomass, NDVI near-infrared
- name: B5 - SWIR1
  wavelength_or_frequency: 1650 nm
  spatial_resolution: 30 m
  wavelength_nm: 1650
  bandwidth_nm: 200.0
  resolution_m: 30.0
  typical_use: Vegetation and soil moisture, snow/cloud
- name: B6 - Thermal infrared
  wavelength_or_frequency: 11.45 um
  spatial_resolution: 120 m
  wavelength_nm: 11450
  bandwidth_nm: 2100.0
  resolution_m: 120.0
  typical_use: Surface temperature (120 m, resampled to 30 m)
- name: B7 - SWIR2
  wavelength_or_frequency: 2215 nm
  spatial_resolution: 30 m
  wavelength_nm: 2215
  bandwidth_nm: 270.0
  resolution_m: 30.0
  typical_use: Geology, burned area, moisture
spatial_resolution_summary: 30 m (thermal 120 m, resampled to 30 m)
