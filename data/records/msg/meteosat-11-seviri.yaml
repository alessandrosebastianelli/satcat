id: meteosat-11-seviri
mission_name: Meteosat-11
sensor_name: SEVIRI (Spinning Enhanced Visible and InfraRed Imager)
agency: EUMETSAT
mission_family: MSG
status: Active
launch_year: 2015
end_of_life_year: null
short_description: Meteosat Second Generation geostationary satellite carrying SEVIRI, imaging Europe/Africa/Atlantic
  every 15 minutes across 12 channels.
long_description: 'Meteosat-11 is part of the Meteosat Second Generation (MSG) series operated by EUMETSAT
  from geostationary orbit (0° or shifted longitude depending on operational role: prime, rapid-scan,
  or in-orbit backup). Its SEVIRI instrument images the full Earth disc (Europe, Africa, Atlantic, Indian
  Ocean) every 15 minutes across 12 spectral channels (11 narrow-band + 1 high-resolution visible), the
  backbone dataset for short-term weather forecasting (nowcasting), severe storm tracking, and fire/dust
  detection over the EUMETSAT coverage area.'
