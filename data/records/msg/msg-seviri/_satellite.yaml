mission_name: MSG (Meteosat Second Generation)
sensor_name: SEVIRI (Spinning Enhanced Visible and InfraRed Imager)
agency: EUMETSAT / ESA
mission_family: MSG
status: Active
launch_year: 2002
end_of_life_year: null
short_description: '12-channel geostationary imager: a full-disc image every 15 minutes (3 km, HRV 1 km)
  over Europe, Africa and the Atlantic, with 5-minute rapid scan and Indian Ocean coverage.'
long_description: The Meteosat Second Generation satellites (Meteosat-8 launched 2002, -9 in 2005, -10
  in 2012, -11 in 2015) carry SEVIRI, which scans the full Earth disc every 15 minutes in 12 channels
  (11 at 3 km at the sub-satellite point and a 1 km high-resolution visible channel). A rapid scan service
  repeats the northern third of the disc every 5 minutes, and the Indian Ocean Data Coverage (IODC) service
  uses Meteosat-9 at 45.5 degrees east. Meteosat-8 was retired on 1 July 2022. Since Meteosat-12 (MTG-I1)
  took over the prime service in 2025 the remaining MSG satellites act as rapid scan, backup and IODC
  satellites, and their roles change over time, so check the EUMETSAT pages for the current configuration.
  SEVIRI is the long-running source for nowcasting, cloud, fire, land surface temperature and climate
  data records over Europe and Africa.
