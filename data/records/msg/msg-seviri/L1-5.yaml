notes: 'Collection IDs: EO:EUM:DAT:MSG:HRSEVIRI (0 degrees full disc), EO:EUM:DAT:MSG:MSG15-RSS (rapid
  scan) and EO:EUM:DAT:MSG:HRSEVIRI-IODC (Indian Ocean). Meteosat-12 / MTG-FCI continues this record at
  higher resolution; to build long series, mind the differences in channels and spectral response.'
known_limitations: 'Coarse 3 km pixels degrade quickly towards the disc edge (about 5-6 km over Europe).
  Native format is specific to MSG: use satpy, pytroll or EUMETSAT''s own tools to read it. Radiometric
  calibration varies slightly between the four satellites.'
example_use_cases: Convective storm nowcasting; fog and low-cloud detection; fire and dust monitoring;
  diurnal cycle of land surface temperature; cloud climatologies.
extra_sections:
- title: Satellites, positions and roles
  content: Meteosat-8 (2002, retired 1 July 2022), Meteosat-9 (2005; Indian Ocean data coverage at 45.5
    E), Meteosat-10 (2012) and Meteosat-11 (2015). Rapid scan and backup roles are shared between Meteosat-10
    and Meteosat-11 and have changed since Meteosat-12 became the prime service in 2025. Check EUMETSAT
    for the current assignment.
