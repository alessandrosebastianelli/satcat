snippets:
- title: Python
  lang: python
  description: Downloads one full-disc SEVIRI scan from the EUMETSAT Data Store (needs a free account
    and consumer key/secret, asked at run time) and plots the 10.8 um channel with satpy.
  requirements:
  - eumdac
  - satpy
  - netCDF4
  - h5netcdf
  - matplotlib
  code: |
    import datetime as dt
    import getpass
    import shutil
    import zipfile
    from pathlib import Path

    import eumdac

    # Free consumer key / secret: https://api.eumetsat.int/api-key (EUMETSAT Data Store account)
    token = eumdac.AccessToken((input("EUMETSAT consumer key: "), getpass.getpass("EUMETSAT consumer secret: ")))
    datastore = eumdac.DataStore(token)
    collection = datastore.get_collection("EO:EUM:DAT:MSG:HRSEVIRI")

    products = list(collection.search(dtstart=dt.datetime(2024, 6, 1, 12, 0), dtend=dt.datetime(2024, 6, 1, 12, 15)))
    print(len(products), "SEVIRI L1.5 products found")
    if not products:
        raise SystemExit("Nothing in this time window - try another one")
    product = products[0]
    print(product)

    out = Path("data")
    out.mkdir(exist_ok=True)
    # about 100-150 MB per full-disc scan
    with product.open() as src, open(out / src.name, "wb") as dst:
        shutil.copyfileobj(src, dst)
    for z in out.glob("*.zip"):                     # some collections arrive zipped
        with zipfile.ZipFile(z) as zf:
            zf.extractall(out / z.stem)

    from glob import glob

    import matplotlib.pyplot as plt
    from satpy import Scene

    files = sorted(glob("data/**/*.nat", recursive=True))
    print(len(files), "files")
    scn = Scene(filenames=files, reader="seviri_l1b_native")
    print(scn.available_dataset_names())
    scn.load(["IR_108"])
    scn["IR_108"].plot(cmap="gray_r")              # brightness temperature (K)
    plt.title("SEVIRI IR 10.8 um")
    plt.show()
- title: Original Method
  lang: bash
  description: Official EUMETSAT Data Store client. The same data can be ordered from data.eumetsat.int
    or received in real time through EUMETCast (satellite or terrestrial).
  code: |
    # SEVIRI Level 1.5 full-disc image data (0 degrees). Use MSG15-RSS for rapid scan and HRSEVIRI-IODC for the Indian Ocean.
    pip install eumdac
    eumdac set-credentials YOUR_CONSUMER_KEY YOUR_CONSUMER_SECRET   # https://api.eumetsat.int/api-key
    eumdac search -c EO:EUM:DAT:MSG:HRSEVIRI -s 2024-06-01T12:00:00 -e 2024-06-01T12:30:00
    eumdac download -c EO:EUM:DAT:MSG:HRSEVIRI -s 2024-06-01T12:00:00 -e 2024-06-01T12:30:00 -o data
