snippets:
- title: Python
  lang: python
  description: Downloads one SEVIRI cloud mask (GRIB2) from the EUMETSAT Data Store and plots the first
    dataset with satpy. Needs a free account and consumer key/secret, asked at run time.
  requirements:
  - eumdac
  - satpy
  - netCDF4
  - h5netcdf
  - matplotlib
  - eccodes
  code: |
    import datetime as dt
    import getpass
    import shutil
    import zipfile
    from pathlib import Path

    import eumdac

    # Free consumer key / secret: https://api.eumetsat.int/api-key (EUMETSAT Data Store account)
    token = eumdac.AccessToken((input("EUMETSAT consumer key: "), getpass.getpass("EUMETSAT consumer secret: ")))
    datastore = eumdac.DataStore(token)
    collection = datastore.get_collection("EO:EUM:DAT:MSG:CLM")

    products = list(collection.search(dtstart=dt.datetime(2024, 6, 1, 12, 0), dtend=dt.datetime(2024, 6, 1, 12, 30)))
    print(len(products), "SEVIRI cloud mask products found")
    if not products:
        raise SystemExit("Nothing in this time window - try another one")
    product = products[0]
    print(product)

    out = Path("data")
    out.mkdir(exist_ok=True)
    # a few MB per product
    with product.open() as src, open(out / src.name, "wb") as dst:
        shutil.copyfileobj(src, dst)
    for z in out.glob("*.zip"):                     # some collections arrive zipped
        with zipfile.ZipFile(z) as zf:
            zf.extractall(out / z.stem)

    from glob import glob

    import matplotlib.pyplot as plt
    from satpy import Scene

    files = sorted(glob("data/**/*.grb*", recursive=True))
    print(len(files), "files")
    scn = Scene(filenames=files, reader="seviri_l2_grib")
    print(scn.available_dataset_names())
    name = scn.available_dataset_names()[0]
    scn.load([name])
    scn[name].plot()
    plt.title(name)
    plt.show()
- title: Original Method
  lang: bash
  description: Official EUMETSAT Data Store client. The same data can be ordered from data.eumetsat.int
    or received in real time through EUMETCast (satellite or terrestrial).
  code: |
    # SEVIRI Level-2 cloud mask. Other collections: CTH, OCA, GII, FIR, MPE-GRIB, AMV, ASR, CRM.
    pip install eumdac
    eumdac set-credentials YOUR_CONSUMER_KEY YOUR_CONSUMER_SECRET   # https://api.eumetsat.int/api-key
    eumdac search -c EO:EUM:DAT:MSG:CLM -s 2024-06-01T12:00:00 -e 2024-06-01T12:30:00
    eumdac download -c EO:EUM:DAT:MSG:CLM -s 2024-06-01T12:00:00 -e 2024-06-01T12:30:00 -o data
related_datasets:
