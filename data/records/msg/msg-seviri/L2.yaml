internal_projects: Not yet used in a specific internal project - flag here once it is.
notes: Collection IDs follow EO:EUM:DAT:MSG:<product>, with an -IODC suffix for the Indian Ocean service
  and RSS- for rapid scan products. Land and climate products from SEVIRI (surface temperature, albedo,
  fire radiative power, evapotranspiration) are produced by the Satellite Application Facilities (LSA
  SAF, CM SAF, NWC SAF) and distributed through their own portals.
known_limitations: Formats vary by product (GRIB2, BUFR, netCDF). Cloud-dependent products are missing
  under cloud cover. Nowcasting products from NWC SAF are not in this collection.
example_use_cases: Real-time cloud screening; fire alerts; convective-risk indices; operational weather
  services.
