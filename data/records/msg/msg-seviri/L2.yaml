id: msg-seviri-l2
level: L2
level_summary: 'Level 2: EUMETSAT operational products derived from SEVIRI: cloud mask (CLM), cloud top
  height (CTH), optimal cloud analysis (OCA), global instability index (GII), active fire (FIR), multi-sensor
  precipitation estimate (MPE), atmospheric motion vectors (AMV), clear-sky radiances (ASR).'
