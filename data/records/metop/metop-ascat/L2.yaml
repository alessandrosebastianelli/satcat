snippets:
- title: Python
  lang: python
  description: Downloads one ASCAT 25 km wind product from the EUMETSAT Data Store (free account and consumer
    key/secret) and plots wind speed along the swath.
  requirements:
  - eumdac
  - satpy
  - netCDF4
  - h5netcdf
  - matplotlib
  code: |
    import datetime as dt
    import getpass
    import shutil
    import zipfile
    from pathlib import Path

    import eumdac

    # Free consumer key / secret: https://api.eumetsat.int/api-key (EUMETSAT Data Store account)
    token = eumdac.AccessToken((input("EUMETSAT consumer key: "), getpass.getpass("EUMETSAT consumer secret: ")))
    datastore = eumdac.DataStore(token)
    collection = datastore.get_collection("EO:EUM:DAT:METOP:OAS025")

    products = list(collection.search(dtstart=dt.datetime(2024, 6, 1, 12, 0), dtend=dt.datetime(2024, 6, 1, 14, 0)))
    print(len(products), "ASCAT 25 km wind products found")
    if not products:
        raise SystemExit("Nothing in this time window - try another one")
    product = products[0]
    print(product)

    out = Path("data")
    out.mkdir(exist_ok=True)
    # a few MB per orbit
    with product.open() as src, open(out / src.name, "wb") as dst:
        shutil.copyfileobj(src, dst)
    for z in out.glob("*.zip"):                     # some collections arrive zipped
        with zipfile.ZipFile(z) as zf:
            zf.extractall(out / z.stem)

    import xarray as xr

    files = sorted(out.rglob("*.nc"))
    print(files[:3])
    if files:
        try:
            ds = xr.open_dataset(files[0], engine="h5netcdf")
            print(ds)
        except Exception as exc:                      # some products need group="..." or another engine
            print("Could not open directly:", exc)
    else:
        print("No .nc file: the product is in EPS native / BUFR / HDF5 format - read it with satpy, eccodes or the EUMETSAT tools")

    if files and "wind_speed" in ds:
        import matplotlib.pyplot as plt
        plt.scatter(ds["lon"].values.ravel(), ds["lat"].values.ravel(), c=ds["wind_speed"].values.ravel(), s=3, cmap="viridis")
        plt.colorbar(label="wind speed (m/s)")
        plt.show()
- title: Original Method
  lang: bash
  description: Official EUMETSAT Data Store client. The same data can be ordered from data.eumetsat.int
    or received in real time through EUMETCast (satellite or terrestrial).
  code: |
    # ASCAT 25 km ocean wind product. The 12.5 km and Level 1B collections have different IDs.
    pip install eumdac
    eumdac set-credentials YOUR_CONSUMER_KEY YOUR_CONSUMER_SECRET   # https://api.eumetsat.int/api-key
    eumdac search -c EO:EUM:DAT:METOP:OAS025 -s 2024-06-01T12:00:00 -e 2024-06-01T12:30:00
    eumdac download -c EO:EUM:DAT:METOP:OAS025 -s 2024-06-01T12:00:00 -e 2024-06-01T12:30:00 -o data
related_datasets:
- metop-sg-sca-l2
internal_projects: Not yet used in a specific internal project - flag here once it is.
notes: Soil moisture products (H SAF) and reprocessed climate winds (OSI SAF) are distributed by the respective
  SAFs. Variable names in the Python example follow the netCDF wind product and may differ in other formats.
known_limitations: Rain contamination and land/ice contamination near coasts; 180-degree wind direction
  ambiguity removed with NWP information.
example_use_cases: Marine forecasting and storm tracking; soil moisture assimilation; polar sea-ice monitoring.
