- name: ASCAT C-band VV
  wavelength_or_frequency: 5.255 GHz
  spatial_resolution: 12.5 / 25 km
  resolution_m: 25000.0
  frequency_ghz: 5.255
  typical_use: Ocean wind vectors, soil moisture, ice
spatial_resolution_summary: 12.5 km and 25 km wind vector cells (native footprints about 25-50 km)
