notes: EPS native files are usually processed with AAPP, which also produces the AAPP L1C format read
  by satpy (mhs_l1c_aapp).
known_limitations: Needs a dedicated reader; the Python example only inspects the file when it is netCDF.
example_use_cases: Humidity assimilation; precipitation and snowfall retrieval.
