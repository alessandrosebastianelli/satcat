mission_name: Metop (EPS)
sensor_name: IASI (Infrared Atmospheric Sounding Interferometer)
agency: EUMETSAT / ESA
mission_family: Metop
status: Active
launch_year: 2006
end_of_life_year: null
short_description: Hyperspectral infrared sounder (645-2760 cm-1, 8461 channels, 12 km footprint) providing
  temperature, humidity and trace gas information twice daily, globally.
long_description: IASI (built by CNES for EUMETSAT) is a Fourier-transform spectrometer measuring the
  thermal infrared at 0.25 cm-1 sampling (0.5 cm-1 apodised resolution) with 8461 channels per spectrum.
  It is among the most important instruments for numerical weather prediction and atmospheric composition
  (O3, CO, CH4, NH3, SO2, dust). Metop-A (launched 2006) was decommissioned in November 2021. Metop-B
  (2012) and Metop-C (2018) are operational; the Metop-SG series is replacing them. It is succeeded by
  IASI-NG on Metop-SG.
instrument_type: Hyperspectral infrared sounder (Fourier-transform interferometer)
