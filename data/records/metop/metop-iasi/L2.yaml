snippets:
- title: Python
  lang: python
  description: Downloads one IASI L2 sounding product from the EUMETSAT Data Store (free account and consumer
    key/secret, asked at run time) and opens it.
  requirements:
  - eumdac
  - satpy
  - netCDF4
  - h5netcdf
  - matplotlib
  code: |
    import datetime as dt
    import getpass
    import shutil
    import zipfile
    from pathlib import Path

    import eumdac

    # Free consumer key / secret: https://api.eumetsat.int/api-key (EUMETSAT Data Store account)
    token = eumdac.AccessToken((input("EUMETSAT consumer key: "), getpass.getpass("EUMETSAT consumer secret: ")))
    datastore = eumdac.DataStore(token)
    collection = datastore.get_collection("EO:EUM:DAT:METOP:IASSND02")

    products = list(collection.search(dtstart=dt.datetime(2024, 6, 1, 12, 0), dtend=dt.datetime(2024, 6, 1, 12, 20)))
    print(len(products), "IASI L2 sounding products found")
    if not products:
        raise SystemExit("Nothing in this time window - try another one")
    product = products[0]
    print(product)

    out = Path("data")
    out.mkdir(exist_ok=True)
    # tens of MB per product
    with product.open() as src, open(out / src.name, "wb") as dst:
        shutil.copyfileobj(src, dst)
    for z in out.glob("*.zip"):                     # some collections arrive zipped
        with zipfile.ZipFile(z) as zf:
            zf.extractall(out / z.stem)

    import xarray as xr

    files = sorted(out.rglob("*.nc"))
    print(files[:3])
    if files:
        try:
            ds = xr.open_dataset(files[0], engine="h5netcdf")
            print(ds)
        except Exception as exc:                      # some products need group="..." or another engine
            print("Could not open directly:", exc)
    else:
        print("No .nc file: the product is in EPS native / BUFR / HDF5 format - read it with satpy, eccodes or the EUMETSAT tools")
- title: Original Method
  lang: bash
  description: Official EUMETSAT Data Store client. The same data can be ordered from data.eumetsat.int
    or received in real time through EUMETCast (satellite or terrestrial).
  code: |
    # IASI Level 2 temperature/humidity/ozone profiles (EUMETSAT PPF)
    pip install eumdac
    eumdac set-credentials YOUR_CONSUMER_KEY YOUR_CONSUMER_SECRET   # https://api.eumetsat.int/api-key
    eumdac search -c EO:EUM:DAT:METOP:IASSND02 -s 2024-06-01T12:00:00 -e 2024-06-01T12:30:00
    eumdac download -c EO:EUM:DAT:METOP:IASSND02 -s 2024-06-01T12:00:00 -e 2024-06-01T12:30:00 -o data
related_datasets:
- metop-iasi-l1c
- metop-sg-iasi-ng-l2
internal_projects: Not yet used in a specific internal project - flag here once it is.
notes: Collection IDs of trace-gas products (CO, SO2, NH3 and others) are separate; list them on the Data
  Store. Research products from ULB/LATMOS and others are distributed through their own portals.
known_limitations: Retrievals under cloud are less reliable; version changes affect time series; check
  the quality flags.
example_use_cases: Atmospheric composition studies; assimilation of retrieved profiles; volcanic SO2 and
  fire CO monitoring.
