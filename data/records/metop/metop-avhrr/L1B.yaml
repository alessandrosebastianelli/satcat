- name: Ch1 - visible
  wavelength_or_frequency: 0.58-0.68 um
  spatial_resolution: 1.1 km
  wavelength_nm: 630
  bandwidth_nm: 100.0
  resolution_m: 1100.0
  typical_use: Clouds, vegetation, snow (daytime)
- name: Ch2 - near infrared
  wavelength_or_frequency: 0.725-1.0 um
  spatial_resolution: 1.1 km
  wavelength_nm: 862
  bandwidth_nm: 275.0
  resolution_m: 1100.0
  typical_use: Vegetation, water/land contrast
- name: Ch3a - shortwave infrared
  wavelength_or_frequency: 1.58-1.64 um
  spatial_resolution: 1.1 km
  wavelength_nm: 1610
  bandwidth_nm: 60.0
  resolution_m: 1100.0
  typical_use: Snow/ice and cloud phase (daytime)
- name: Ch3b - mid infrared
  wavelength_or_frequency: 3.55-3.93 um
  spatial_resolution: 1.1 km
  wavelength_nm: 3740
  bandwidth_nm: 380.0
  resolution_m: 1100.0
  typical_use: Fires, night low cloud, SST
- name: Ch4 - thermal infrared
  wavelength_or_frequency: 10.3-11.3 um
  spatial_resolution: 1.1 km
  wavelength_nm: 10800
  bandwidth_nm: 1000.0
  resolution_m: 1100.0
  typical_use: Cloud top and surface temperature
- name: Ch5 - thermal infrared
  wavelength_or_frequency: 11.5-12.5 um
  spatial_resolution: 1.1 km
  wavelength_nm: 12000
  bandwidth_nm: 1000.0
  resolution_m: 1100.0
  typical_use: 'Split window: SST, dust, ash'
spatial_resolution_summary: 1.1 km at nadir (LAC/HRPT/FRAC), 4 km (GAC); pixels widen toward the swath
  edge
