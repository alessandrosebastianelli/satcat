internal_projects: Not yet used in a specific internal project - flag here once it is.
notes: 'Collection ID shown is the operational global AVHRR L1B; verify it on data.eumetsat.int, as IDs
  and versions evolve. Channel naming in satpy: 1, 2, 3a, 3b, 4, 5.'
known_limitations: Native EPS format needs a dedicated reader (satpy, AAPP or EUMETSAT tools). Channel
  3 switches between 3a and 3b along the orbit. No onboard calibration of the visible channels.
example_use_cases: SST and vegetation climatologies; cloud and snow mapping; fire detection; bridging
  NOAA POES and VIIRS records.
