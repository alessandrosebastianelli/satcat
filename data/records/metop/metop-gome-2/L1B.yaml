internal_projects: Not yet used in a specific internal project - flag here once it is.
notes: Verify the collection ID on data.eumetsat.int. GOME-2 Metop-A moved to a reduced swath (960 km)
  in 2013.
known_limitations: Coarse pixels compared with TROPOMI; degradation of the instrument is corrected in
  processing but affects long time series.
example_use_cases: Total ozone monitoring; NO2 and SO2 time series; bridging GOME/SCIAMACHY, OMI and TROPOMI.
