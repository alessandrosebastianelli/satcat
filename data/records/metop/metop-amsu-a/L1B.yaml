known_limitations: Needs a dedicated reader; the Python example only inspects the file when it is netCDF.
  AMSU-A2 channel 2 on Metop-A was lost; check satellite notes.
example_use_cases: Temperature profile assimilation; climate records of tropospheric temperature (with
