mission_name: Metop (EPS)
sensor_name: AMSU-A (Advanced Microwave Sounding Unit-A)
agency: EUMETSAT / ESA
mission_family: Metop
status: Active
launch_year: 2006
end_of_life_year: null
short_description: 15-channel microwave temperature sounder (23.8-89 GHz, 48 km at nadir) on Metop-A/B/C;
  part of the ATOVS suite.
long_description: AMSU-A observes oxygen absorption lines near 50-60 GHz to retrieve atmospheric temperature
  profiles from the surface to about 40 km, independently of clouds, and has window channels for cloud
  liquid water, precipitation and surface properties. It is among the most assimilated observations in
  NWP. Metop-A (launched 2006) was decommissioned in November 2021. Metop-B (2012) and Metop-C (2018)
  are operational; the Metop-SG series is replacing them. It is succeeded by MWS on Metop-SG.
instrument_type: Passive microwave temperature sounder (15 channels)
orbit_type: LEO sun-synchronous (about 817 km, 09:30 descending node)
