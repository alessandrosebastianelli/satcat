notes: Combine with Landsat 8 collection for the shortest available Landsat-family revisit (8 days). Coverage
  stops around ±81° latitude — a real orbital/tiling-grid limit (not a metadata gap), so true polar ice
  sheets fall outside the systematic acquisition mask.
known_limitations: Very similar spectral response to Landsat 8 but not bit-identical — apply cross-calibration
  for strict multi-sensor time series.
example_use_cases: High-frequency 30m land monitoring when combined with Landsat 8.
