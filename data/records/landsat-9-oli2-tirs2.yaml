id: landsat-9-oli2-tirs2
mission_name: Landsat 9
sensor_name: OLI-2/TIRS-2 (Operational Land Imager 2 / Thermal Infrared Sensor 2)
agency: NASA / USGS
mission_family: Landsat
status: Active
launch_year: 2021
end_of_life_year: null
short_description: Near-identical successor to Landsat 8 with improved radiometric resolution (14 bit)
  and a better-calibrated thermal sensor; flies 8 days out of phase with Landsat 8 for combined 8-day
  revisit.
long_description: 'Landsat 9 replicates Landsat 8''s OLI/TIRS design with two key upgrades: 14-bit radiometric
  resolution (vs 12-bit on Landsat 8), improving sensitivity to subtle reflectance differences, and a
  TIRS-2 instrument with reduced stray-light contamination compared to Landsat 8''s TIRS. Flying in the
  same orbit as Landsat 8 but offset by 8 days gives the combined constellation an effective 8-day global
  revisit, the shortest in Landsat program history.'
