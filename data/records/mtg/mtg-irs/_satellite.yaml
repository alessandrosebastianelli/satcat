short_description: 'First hyperspectral infrared sounder in geostationary orbit: temperature and humidity
  profiles over Europe every 30 minutes and the full disc every hour.'
long_description: MTG-S1 (Meteosat-13) was launched on 1 July 2025 and carries the InfraRed Sounder (IRS),
  a Fourier-transform interferometer measuring the long-wave (about 700-1210 cm-1) and mid-wave (about
  1600-2175 cm-1) infrared spectrum at 0.625 cm-1 spectral sampling with about 4 km spatial sampling.
  It provides vertical profiles of temperature and humidity, trace gases and winds from geostationary
  orbit, with local-area coverage over Europe about every 30 minutes. The IRS entered operational service
  in October 2026 and MTG-S1 shares its platform with the Copernicus Sentinel-4 UVN. It produces large
  data volumes (hundreds of GB per day at Level 1).
