- mtg-fci-l1c
internal_projects: Not yet used in a specific internal project - flag here once it is.
notes: 'Collection IDs are listed on data.eumetsat.int: the Python example prints the matching collections.
  Band limits are the nominal ranges.'
known_limitations: Very large volumes (hundreds of GB per day at Level 1); few readers exist yet beyond
  EUMETSAT tools and xarray; collection IDs and versions may change while the service matures.
example_use_cases: Direct assimilation of radiances in NWP; research on retrievals; hyperspectral studies
  of the atmosphere.
