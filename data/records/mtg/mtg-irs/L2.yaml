snippets:
- title: Python
  lang: python
  description: Looks for IRS collections in the EUMETSAT Data Store (title search) and downloads the first
    product of the window. Needs a free account and consumer key/secret, asked at run time. IRS products
    are large.
  requirements:
  - eumdac
  - satpy
  - netCDF4
  - h5netcdf
  - matplotlib
  code: |
    import datetime as dt
    import getpass
    import shutil
    import zipfile
    from pathlib import Path

    import eumdac

    # Free consumer key / secret: https://api.eumetsat.int/api-key (EUMETSAT Data Store account)
    token = eumdac.AccessToken((input("EUMETSAT consumer key: "), getpass.getpass("EUMETSAT consumer secret: ")))
    datastore = eumdac.DataStore(token)
    collections = [c for c in datastore.collections if "irs level" in str(c.title).lower()]
    print([(c.collection_id, str(c.title)) for c in collections])
    if not collections:
        raise SystemExit("Collection not found in the Data Store yet - check data.eumetsat.int")
    collection = collections[0]

    products = list(collection.search(dtstart=dt.datetime(2026, 10, 1, 12, 0), dtend=dt.datetime(2026, 10, 1, 12, 30)))
    print(len(products), "IRS products found")
    if not products:
        raise SystemExit("Nothing in this time window - try another one")
    product = products[0]
    print(product)

    out = Path("data")
    out.mkdir(exist_ok=True)
    with product.open() as src, open(out / src.name, "wb") as dst:
        shutil.copyfileobj(src, dst)
    for z in out.glob("*.zip"):                     # some collections arrive zipped
        with zipfile.ZipFile(z) as zf:
            zf.extractall(out / z.stem)
    print(sorted(out.rglob('*.nc'))[:5])
- title: Original Method
  lang: bash
  description: Official EUMETSAT Data Store client. The same data can be ordered from data.eumetsat.int
    or received in real time through EUMETCast (satellite or terrestrial).
  code: |
    # IRS Level-2: look the collection ID up on data.eumetsat.int (search 'IRS')
    pip install eumdac
    eumdac set-credentials YOUR_CONSUMER_KEY YOUR_CONSUMER_SECRET   # https://api.eumetsat.int/api-key
    eumdac search -c <COLLECTION_ID_FROM_DATA_STORE> -s 2024-06-01T12:00:00 -e 2024-06-01T12:30:00
    eumdac download -c <COLLECTION_ID_FROM_DATA_STORE> -s 2024-06-01T12:00:00 -e 2024-06-01T12:30:00 -o data
related_datasets:
- mtg-irs-l1
- mtg-fci-l2
- mtg-li-l2
internal_projects: Not yet used in a specific internal project - flag here once it is.
notes: Combine IRS profiles with FCI clouds and LI lightning for a 4D view of storm development. Check
  the Data Store for the available L2 collections.
known_limitations: Retrievals are less reliable under thick cloud; early operational versions are still
  being tuned.
example_use_cases: Nowcasting of convection; detection of pre-convective instability; model validation.
