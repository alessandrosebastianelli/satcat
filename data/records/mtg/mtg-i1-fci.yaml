id: mtg-i1-fci
mission_name: MTG-I1
sensor_name: FCI (Flexible Combined Imager)
agency: EUMETSAT
mission_family: MTG
status: Active
launch_year: 2022
end_of_life_year: null
short_description: First Meteosat Third Generation Imager satellite, carrying FCI — a major resolution/spectral
  upgrade over MSG's SEVIRI, 16 channels at 1-2 km, full disc every 10 minutes.
long_description: MTG-I1 is the first imaging satellite of the Meteosat Third Generation (MTG) series,
  succeeding MSG. Its FCI (Flexible Combined Imager) covers 16 spectral channels (vs SEVIRI's 12) at improved
  1-2 km resolution (0.5 km for the high-resolution visible channel), with full-disc scans every 10 minutes
  (vs 15 on MSG) plus an optional rapid-scan mode over Europe every 2.5 minutes. It also carries the Lightning
  Imager (LI), new to the Meteosat program, for continuous lightning detection.
