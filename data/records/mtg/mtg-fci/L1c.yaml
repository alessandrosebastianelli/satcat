internal_projects: Not yet used in a specific internal project - flag here once it is.
notes: 'Collection IDs: EO:EUM:DAT:0662 (FCI L1c normal resolution FDHSI) and EO:EUM:DAT:0665 (high resolution
  HRFI). Band centres and widths here are nominal values: check the FCI Level 1 Product User Guide for
  the exact spectral response. Channel names follow the satpy convention (vis_04 ... ir_133).'
known_limitations: Files are large and split into 41 chunks per full-disc repeat cycle; satpy is the usual
  way to assemble them. Operational data formats and collection IDs can evolve as MTG-I2 enters service.
example_use_cases: High-frequency nowcasting; convective initiation; fire and smoke monitoring; true-colour
  imagery of Europe and Africa every 10 minutes; replacing SEVIRI in existing pipelines.
