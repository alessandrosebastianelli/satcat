mission_name: MTG-I (Meteosat Third Generation Imager)
sensor_name: FCI (Flexible Combined Imager)
agency: EUMETSAT / ESA
mission_family: MTG
status: Active
launch_year: 2022
end_of_life_year: null
short_description: '16-channel geostationary imager succeeding SEVIRI: full disc every 10 minutes at 1-2
  km, with a 2.5-minute rapid scan over Europe from the second MTG-I satellite.'
long_description: The Flexible Combined Imager on the MTG-I satellites images the Earth in 16 channels
  (8 solar, 8 thermal) with a 1 km (visible/near-infrared) and 2 km (infrared) sampling at the sub-satellite
  point, and a 4-channel high-resolution mode at 0.5-1 km (HRFI). The first imager satellite MTG-I1 (Meteosat-12)
  was launched on 13 December 2022 and became the prime EUMETSAT geostationary service in 2025, delivering
  a full disc every 10 minutes. The second, MTG-I2 (Meteosat-14), was launched on 27 August 2026 and will
  provide the rapid scan service over Europe every 2.5 minutes once commissioned. FCI continues and greatly
  improves the SEVIRI record, and produces at least 50 times more data than MSG.
