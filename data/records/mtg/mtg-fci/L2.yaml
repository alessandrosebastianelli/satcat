snippets:
- title: Python
  lang: python
  description: Downloads one FCI Level-2 cloud mask (netCDF) from the EUMETSAT Data Store (needs a free
    account and consumer key/secret, asked at run time) and plots the first dataset with satpy.
  requirements:
  - eumdac
  - satpy
  - netCDF4
  - h5netcdf
  - matplotlib
  code: |
    import datetime as dt
    import getpass
    import shutil
    import zipfile
    from pathlib import Path

    import eumdac

    # Free consumer key / secret: https://api.eumetsat.int/api-key (EUMETSAT Data Store account)
    token = eumdac.AccessToken((input("EUMETSAT consumer key: "), getpass.getpass("EUMETSAT consumer secret: ")))
    datastore = eumdac.DataStore(token)
    collection = datastore.get_collection("EO:EUM:DAT:0678")

    products = list(collection.search(dtstart=dt.datetime(2025, 6, 1, 12, 0), dtend=dt.datetime(2025, 6, 1, 12, 20)))
    print(len(products), "FCI cloud mask products found")
    if not products:
        raise SystemExit("Nothing in this time window - try another one")
    product = products[0]
    print(product)

    out = Path("data")
    out.mkdir(exist_ok=True)
    # tens of MB per product
    with product.open() as src, open(out / src.name, "wb") as dst:
        shutil.copyfileobj(src, dst)
    for z in out.glob("*.zip"):                     # some collections arrive zipped
        with zipfile.ZipFile(z) as zf:
            zf.extractall(out / z.stem)

    from glob import glob

    import matplotlib.pyplot as plt
    from satpy import Scene

    files = sorted(glob("data/**/*.nc", recursive=True))
    print(len(files), "files")
    scn = Scene(filenames=files, reader="fci_l2_nc")
    print(scn.available_dataset_names())
    name = scn.available_dataset_names()[0]
    scn.load([name])
    scn[name].plot()
    plt.title(name)
    plt.show()
- title: Original Method
  lang: bash
  description: Official EUMETSAT Data Store client. The same data can be ordered from data.eumetsat.int
    or received in real time through EUMETCast (satellite or terrestrial).
  code: |
    # FCI Level-2 cloud mask (netCDF). Other collections: ASR 0677, GII 0683, OCA 0684.
    pip install eumdac
    eumdac set-credentials YOUR_CONSUMER_KEY YOUR_CONSUMER_SECRET   # https://api.eumetsat.int/api-key
    eumdac search -c EO:EUM:DAT:0678 -s 2024-06-01T12:00:00 -e 2024-06-01T12:30:00
    eumdac download -c EO:EUM:DAT:0678 -s 2024-06-01T12:00:00 -e 2024-06-01T12:30:00 -o data
