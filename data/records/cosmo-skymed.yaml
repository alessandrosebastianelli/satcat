short_description: Italian dual-use (civil/defense) X-band SAR constellation, 1st generation (4 satellites,
  2007-2010) plus 2nd generation satellites, up to ~1 m resolution in Spotlight mode.
long_description: COSMO-SkyMed (COnstellation of small Satellites for the Mediterranean basin Observation)
  is ASI's X-band SAR constellation, operated for both civil and defense applications. The first generation
  (4 identical satellites launched 2007-2010) provides resolutions from ~1 m (Spotlight) to ~100 m (ScanSAR/Huge
  Region), with very short revisit thanks to the 4-satellite constellation. A second generation (CSG)
  began launching in 2019 with improved SAR performance and additional polarimetric/interferometric capabilities.
  Commercial/institutional access is more restricted than Sentinel-1 — typically via ASI/e-GEOS for tasked,
  high-resolution acquisitions.
