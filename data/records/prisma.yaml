id: prisma
mission_name: PRISMA
sensor_name: PRISMA Hyperspectral Sensor
agency: ASI (Italian Space Agency)
mission_family: ''
status: Active
launch_year: 2019
end_of_life_year: null
short_description: Italian hyperspectral mission with ~239 contiguous VNIR/SWIR bands at 30 m, plus a
  5 m panchromatic band, aimed at detailed material/vegetation spectral characterization.
long_description: PRISMA (PRecursore IperSpettrale della Missione Applicativa) is ASI's hyperspectral
  Earth observation satellite, acquiring ~239 narrow, contiguous spectral bands across VNIR (400-1010
  nm) and SWIR (920-2505 nm) at 30 m resolution, alongside a 5 m panchromatic band for sharpening. Unlike
  multispectral sensors (Sentinel-2, Landsat) with a handful of broad bands, PRISMA's dense spectral sampling
  supports detailed material identification — mineral mapping, precision agriculture (crop stress/nutrient
  status), water quality, and soil properties — at the cost of a narrow ~30 km swath and tasked (not continuous
  global) acquisition.
instrument_type: Optical - Hyperspectral
orbit_type: LEO - Sun-synchronous
