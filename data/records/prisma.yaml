notes: This record lists a representative subset (44 of ~239 total bands, evenly sampled) so the spectral
  chart is readable — real PRISMA products have contiguous ~9-12 nm-spaced bands across the full VNIR
  (400-1010 nm) and SWIR (920-2505 nm) ranges, not just these samples. Acquisitions must be tasked/ordered
  ahead of time for a specific area — it's not a wall-to-wall continuous archive like Sentinel-2. Plan
  requests with lead time.
known_limitations: Narrow 30km swath; tasked (not systematic) acquisition means gaps in temporal coverage
  for a given area.
example_use_cases: Precision agriculture crop stress mapping; mineral/geological mapping; detailed water
  quality analysis.
