short_description: 13-band multispectral optical constellation, the reference for NDVI and vegetation/land
  cover monitoring at 10-60 m resolution.
long_description: Sentinel-2 is a constellation of two optical satellites (2A since 2015, 2B since 2017)
  designed primarily for observing vegetation, soil, and inland/ coastal waters. The MSI sensor acquires
  13 spectral bands from visible to short-wave infrared, at spatial resolutions of 10, 20, or 60 m depending
  on the band. It is the most widely used source for vegetation indices such as NDVI/EVI and for medium-to-high
  resolution land cover classification with frequent revisit.
