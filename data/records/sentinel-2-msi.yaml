notes: Use the "Harmonized" collection on Google Earth Engine to avoid the radiometric offset introduced
  by processing baseline 04.00 (from late 2021 onward, raw non-harmonized values have a +1000 shift).
  Coverage stops around ±81° latitude — a real orbital/tiling-grid limit (not a metadata gap), so true
  polar ice sheets fall outside the systematic acquisition mask.
known_limitations: 'Optical sensor: no valid data under cloud cover, so revisit for a clear observation
  can be much longer than the nominal 5 days depending on season and location. Always apply a cloud mask
  (e.g. using the SCL band or s2cloudless).'
example_use_cases: Crop monitoring and vegetation health via NDVI time series; burned area mapping after
  wildfires; land cover change detection over multi-year periods.
