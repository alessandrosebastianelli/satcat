id: landsat-4-tm
mission_name: Landsat 4
sensor_name: TM (Thematic Mapper)
agency: NASA / USGS
mission_family: Landsat
status: Decommissioned
launch_year: 1982
end_of_life_year: 1993
short_description: Introduced the Thematic Mapper (TM), a major resolution and spectral upgrade over MSS,
  including the first SWIR bands in the Landsat series.
long_description: 'Landsat 4 was a generational leap: the new Thematic Mapper instrument improved spatial
  resolution from ~79 m to 30 m (except thermal, 120 m) and added short-wave infrared bands useful for
  geology and vegetation moisture. A transmitter failure limited direct downlink for part of the mission,
  but TDRS relay kept it partly operational. TM became the spectral/resolution template for Landsat 5
  and strongly influenced later Landsat instrument design.'
