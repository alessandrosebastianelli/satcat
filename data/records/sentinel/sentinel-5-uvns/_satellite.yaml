short_description: Polar-orbiting UV-VIS-NIR-SWIR spectrometer on Metop-SG for daily global monitoring
  of air pollutants, ozone, aerosols and greenhouse-related gases.
long_description: 'Sentinel-5 is a hosted payload on the Metop Second Generation A satellites. The first,
  Metop-SG-A1, was launched on 13 August 2025. The UVNS imaging spectrometer covers the ultraviolet to
  shortwave infrared, delivering daily global maps of ozone, nitrogen dioxide, sulphur dioxide, formaldehyde,
  carbon monoxide, methane and aerosols at about 7.5 km, a clear step up from Sentinel-5P. Operational
  data release timing depends on the commissioning of Metop-SG-A1: check the EUMETSAT Data Store for current
  availability.'
