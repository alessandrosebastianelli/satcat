gee_snippet: "// Sentinel-5P NO2 tropospheric column density\nvar collection = ee.ImageCollection('COPERNICUS/S5P/OFFL/L3_NO2')\n\
  \  .select('tropospheric_NO2_column_number_density')\n  .filterDate('2024-06-01', '2024-06-30');\nvar\
  \ mean = collection.mean();\nMap.addLayer(mean, {min: 0, max: 0.0002, palette: ['black','blue','purple','cyan','green','yellow','red']},\
  \ 'NO2');\n"
