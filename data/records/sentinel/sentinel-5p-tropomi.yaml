id: sentinel-5p-tropomi
mission_name: Sentinel-5P
sensor_name: TROPOMI
agency: ESA / Copernicus
mission_family: Sentinel
status: Active
launch_year: 2017
end_of_life_year: null
short_description: Atmospheric composition mission, single instrument (TROPOMI) mapping trace gases like
  NO2, SO2, CO, CH4, and ozone at ~5.5x3.5 km resolution.
long_description: Sentinel-5P (Precursor, ahead of the operational Sentinel-5 payload on MTG-S) carries
  TROPOMI, a hyperspectral spectrometer covering UV, visible, NIR and SWIR bands to retrieve column concentrations
  of NO2, SO2, CO, CH4, formaldehyde and ozone, plus aerosol and cloud information. Daily global coverage
  makes it the reference open dataset for air-quality and methane-emission monitoring.
