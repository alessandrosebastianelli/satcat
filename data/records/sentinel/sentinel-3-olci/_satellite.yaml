mission_name: Sentinel-3
sensor_name: OLCI (Ocean and Land Colour Instrument)
agency: ESA / EUMETSAT / Copernicus
mission_family: Sentinel
status: Active
launch_year: 2016
end_of_life_year: null
short_description: 21-band ocean and land colour imager on the Sentinel-3 satellites, at 300 m full resolution,
  for water quality, chlorophyll and vegetation monitoring.
long_description: OLCI is a push-broom imaging spectrometer on the Sentinel-3 satellites (3A launched
  in 2016, 3B in 2018, 3C in September 2026, 3D planned). It measures 21 bands between 400 and 1020 nm
  at 300 m (full resolution) and 1.2 km (reduced resolution), continuing the ENVISAT MERIS heritage. Main
  uses are ocean and coastal water quality (chlorophyll, suspended matter, coloured dissolved organic
  matter), land vegetation indices and atmospheric products (water vapour, aerosols). Global coverage
  is obtained in about 2 days with two satellites.
