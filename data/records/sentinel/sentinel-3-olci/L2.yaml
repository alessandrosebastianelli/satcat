snippets:
- title: Python
  lang: python
  description: Downloads the OGVI layer of one Land Full Resolution product from the Planetary Computer
    (no account needed) and plots it in swath geometry.
  requirements:
  - pystac-client
  - planetary-computer
  - xarray
  - netCDF4
  - requests
  - matplotlib
  code: |
    import matplotlib.pyplot as plt
    import numpy as np
    import planetary_computer
    import pystac_client
    import requests
    import xarray as xr

    catalog = pystac_client.Client.open(
        "https://planetarycomputer.microsoft.com/api/stac/v1",
        modifier=planetary_computer.sign_inplace,
    )



    search = catalog.search(
        collections=["sentinel-3-olci-lfr-l2-netcdf"],
        bbox=[12.4, 41.8, 12.6, 42.0],                      # Rome - change to your area
        datetime="2024-06-01/2024-06-05",
    )
    items = search.item_collection()
    if not items:
        raise SystemExit("No products found - widen the dates or the bounding box")
    item = items[0]
    print(len(items), "products; using", item.id)
    print("assets:", sorted(item.assets))


    def fetch(key):
        path = key + ".nc"
        with requests.get(item.assets[key].href, stream=True) as r:
            r.raise_for_status()
            with open(path, "wb") as f:
                for chunk in r.iter_content(chunk_size=1 << 20):
                    f.write(chunk)
        return xr.open_dataset(path)


    ogvi = fetch("ogvi")                 # OLCI Global Vegetation Index (swath, not gridded)
    var = list(ogvi.data_vars)[0]
    print(ogvi[var])
    ogvi[var].plot(cmap="YlGn", vmin=0, vmax=1)
    plt.title(item.id)
    plt.show()
- title: Google Earth Engine
  lang: javascript
  description: Only Level-1 is in Earth Engine; this computes a simple radiance-based index.
  code: |
    // Earth Engine only hosts the Level-1 OLCI radiances (COPERNICUS/S3/OLCI).
    // For Level-2 land/water products use the Python tab or the Copernicus Data Space.
    var aoi = ee.Geometry.Point([12.5, 41.9]);
    var img = ee.ImageCollection('COPERNICUS/S3/OLCI').filterBounds(aoi)
      .filterDate('2024-06-01', '2024-06-10').median();
    // Simple vegetation index from OLCI bands Oa17 (865 nm) and Oa8 (665 nm)
    var ndvi = img.normalizedDifference(['Oa17_radiance', 'Oa08_radiance']);
    Map.centerObject(aoi, 6);
    Map.addLayer(ndvi, {min: 0, max: 0.8, palette: ['white', 'green']}, 'OLCI NDVI-like index');
- title: Original Method
  lang: bash
  description: Official Copernicus Data Space Ecosystem OData API; the same service is also reachable
    from the browser Copernicus Browser.
  code: |
    # OLCI Level-2 Land Full Resolution (use OL_2_WFR for water)
    # 1) Search the catalogue (OData) - no login needed
    curl -s -G "https://catalogue.dataspace.copernicus.eu/odata/v1/Products" \
      --data-urlencode "\$filter=Collection/Name eq 'SENTINEL-3' and contains(Name,'OL_2_LFR') and ContentDate/Start gt 2024-06-01T00:00:00.000Z and ContentDate/Start lt 2024-06-03T00:00:00.000Z" \
      --data-urlencode "\$top=3" | python3 -m json.tool

    # 2) Get an access token (free account at dataspace.copernicus.eu)
    TOKEN=$(curl -s -d "client_id=cdse-public" -d "username=YOUR_EMAIL" -d "password=YOUR_PASSWORD" \
      -d "grant_type=password" \
      "https://identity.dataspace.copernicus.eu/auth/realms/CDSE/protocol/openid-connect/token" \
      | python3 -c "import sys, json; print(json.load(sys.stdin)['access_token'])")

    # 3) Download a product by the Id found in step 1
    curl -H "Authorization: Bearer $TOKEN" -L -o product.zip \
      "https://download.dataspace.copernicus.eu/odata/v1/Products(PRODUCT_ID)/\$value"
related_datasets:
- sentinel-3-olci-l1
- sentinel-2-msi-l2a
internal_projects: Not yet used in a specific internal project - flag here once it is.
notes: 'Water products (WFR) carry the standard ocean-colour flags: always apply the WQSF mask before
  using chlorophyll or reflectance values. For fine-resolution vegetation work Sentinel-2 is usually better;
  OLCI shines for daily regional/global coverage.'
known_limitations: Land products are provided in swath geometry (not map-projected); you have to reproject
  them yourself. Clouds, glint and adjacency effects limit the water products near coasts.
example_use_cases: Lake and coastal water quality time series; terrestrial chlorophyll index (OTCI) for
  vegetation stress; global FAPAR monitoring.
