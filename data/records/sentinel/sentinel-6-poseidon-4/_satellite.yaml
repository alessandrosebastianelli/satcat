short_description: 'Reference ocean topography mission continuing the Jason series: sea level to millimetre-level
  accuracy from a 10-day repeat orbit.'
long_description: Sentinel-6 is the Copernicus reference altimetry mission, built with NASA, NOAA, CNES
  and EUMETSAT as the successor to the Jason series. Sentinel-6 Michael Freilich was launched in November
  2020 and Sentinel-6B in November 2025, flying in sequence to extend the sea level record. The Poseidon-4
  altimeter works at Ku-band (13.575 GHz) and C-band (5.41 GHz) in an interleaved mode giving both conventional
  low-resolution (LRM) and high-resolution SAR measurements, and an AMR-C radiometer corrects for the
  wet troposphere.
