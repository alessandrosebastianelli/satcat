internal_projects: Not yet used in a specific internal project - flag here once it is.
notes: Use the NTC products for climate and sea level trend work; NRT and STC are for operational use.
known_limitations: Along-track data only; gridded sea level (L4) products are distributed by the Copernicus
  Marine Service.
example_use_cases: Global mean sea level; ocean circulation; eddies; wave climate.
