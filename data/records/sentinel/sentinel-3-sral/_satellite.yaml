short_description: Dual-frequency (Ku/C band) SAR radar altimeter for sea surface height, significant
  wave height, wind speed, and inland water and ice elevation.
long_description: SRAL is the radar altimeter of Sentinel-3, operating at Ku-band (13.575 GHz) and C-band
  (5.41 GHz, used for the ionospheric correction). It works in SAR (delay-Doppler) mode along the whole
  orbit, giving about 300 m along-track resolution, and is supported by a microwave radiometer (MWR) for
  the wet troposphere correction. Applications include ocean topography, significant wave height, sea
  ice freeboard, and the water level of rivers, lakes and reservoirs.
