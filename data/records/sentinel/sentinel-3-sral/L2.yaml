notes: 'Use the NTC (non-time-critical) products for science: they use the best orbit and corrections.
  STC and NRT are faster but less accurate.'
known_limitations: Along-track only. Over land and inland water, retracking of complex waveforms is difficult;
  use the dedicated land (LAN) retrackers and a water mask.
example_use_cases: Reservoir and river level monitoring; mean sea level and wave climate studies; sea
  ice thickness (via freeboard).
