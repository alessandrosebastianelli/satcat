  frequency_ghz: 13.575
  typical_use: Primary altimetric measurement (SAR mode)
- name: C-band
  wavelength_or_frequency: 5.41 GHz
  spatial_resolution: n/a (ionospheric correction)
  frequency_ghz: 5.41
  resolution_m: 7000.0
  typical_use: Ionospheric correction
spatial_resolution_summary: About 300 m along-track (SAR mode), 20 Hz measurements
