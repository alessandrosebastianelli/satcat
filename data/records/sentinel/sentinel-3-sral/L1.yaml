notes: Marine altimetry products are also distributed by EUMETSAT; land and inland-water products come
  from the Copernicus Data Space.
known_limitations: 'Along-track profiles only: the sampling is sparse between ground tracks. L1 is intended
  for altimetry specialists, most users want L2.'
example_use_cases: Waveform re-tracking research; coastal altimetry; sea ice and lead detection.
