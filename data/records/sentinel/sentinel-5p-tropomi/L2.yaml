snippets:
- title: Python
  lang: python
  description: Downloads one TROPOMI offline NO2 orbit from the Planetary Computer (no account needed;
    several hundred MB) and maps the quality-filtered tropospheric column.
  requirements:
  - pystac-client
  - planetary-computer
  - xarray
  - netCDF4
  - requests
  - matplotlib
  code: |
    import matplotlib.pyplot as plt
    import numpy as np
    import planetary_computer
    import pystac_client
    import requests
    import xarray as xr

    catalog = pystac_client.Client.open(
        "https://planetarycomputer.microsoft.com/api/stac/v1",
        modifier=planetary_computer.sign_inplace,
    )



    search = catalog.search(
        collections=["sentinel-5p-l2-netcdf"],
        bbox=[12.4, 41.8, 12.6, 42.0],                      # Rome - change to your area
        datetime="2024-06-01/2024-06-03",
        query={"s5p:processing_mode": {"eq": "OFFL"}},
    )
    items = [i for i in search.item_collection() if "no2" in i.assets]
    if not items:
        raise SystemExit("No NO2 products found - widen the dates or the bounding box")
    item = items[0]
    print(len(items), "NO2 products; using", item.id)

    # One orbit is a few hundred MB
    with requests.get(item.assets["no2"].href, stream=True) as r:
        r.raise_for_status()
        with open("no2.nc", "wb") as f:
            for chunk in r.iter_content(chunk_size=1 << 20):
                f.write(chunk)

    ds = xr.open_dataset("no2.nc", group="PRODUCT")
    no2 = ds["nitrogendioxide_tropospheric_column"][0]
    qa = ds["qa_value"][0]
    no2 = no2.where(qa > 0.75)                   # recommended quality filter
    plt.pcolormesh(ds["longitude"][0], ds["latitude"][0], no2, vmin=0, vmax=2e-4, cmap="magma")
    plt.colorbar(label="tropospheric NO2 column (mol/m2)")
    plt.title(item.id)
    plt.show()
- title: Google Earth Engine
  lang: javascript
  description: Earth Engine hosts L3 gridded versions of the L2 products (NO2, O3, CO, SO2, CH4, HCHO,
    aerosol, cloud) as COPERNICUS/S5P/OFFL/L3_* and COPERNICUS/S5P/NRTI/L3_*.
  code: |
    // Sentinel-5P offline NO2, mean tropospheric column over a month
    var aoi = ee.Geometry.Point([12.5, 41.9]);

    var no2 = ee.ImageCollection('COPERNICUS/S5P/OFFL/L3_NO2')
      .select('tropospheric_NO2_column_number_density')
      .filterDate('2024-06-01', '2024-06-30')
      .mean();

    Map.centerObject(aoi, 5);
    Map.addLayer(no2, {min: 0, max: 0.0002, palette: ['black', 'blue', 'purple', 'cyan', 'green', 'yellow', 'red']}, 'NO2 June 2024');
- title: Original Method
  lang: bash
  description: Official Copernicus Data Space Ecosystem OData API; the same service is also reachable
    from the browser Copernicus Browser.
  code: |
    # TROPOMI Level-2 NO2 (use L2__CO____, L2__CH4___, L2__O3____, ... for the other products)
    # 1) Search the catalogue (OData) - no login needed
    curl -s -G "https://catalogue.dataspace.copernicus.eu/odata/v1/Products" \
      --data-urlencode "\$filter=Collection/Name eq 'SENTINEL-5P' and contains(Name,'L2__NO2___') and ContentDate/Start gt 2024-06-01T00:00:00.000Z and ContentDate/Start lt 2024-06-03T00:00:00.000Z" \
      --data-urlencode "\$top=3" | python3 -m json.tool

    # 2) Get an access token (free account at dataspace.copernicus.eu)
    TOKEN=$(curl -s -d "client_id=cdse-public" -d "username=YOUR_EMAIL" -d "password=YOUR_PASSWORD" \
      -d "grant_type=password" \
      "https://identity.dataspace.copernicus.eu/auth/realms/CDSE/protocol/openid-connect/token" \
      | python3 -c "import sys, json; print(json.load(sys.stdin)['access_token'])")

    # 3) Download a product by the Id found in step 1
    curl -H "Authorization: Bearer $TOKEN" -L -o product.zip \
      "https://download.dataspace.copernicus.eu/odata/v1/Products(PRODUCT_ID)/\$value"
