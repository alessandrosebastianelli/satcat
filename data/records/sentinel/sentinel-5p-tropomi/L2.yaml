internal_projects: Not yet used in a specific internal project - flag here once it is.
notes: Always filter with qa_value (0.75 is the recommended threshold for tropospheric NO2). Earth Engine
  collections are L3 binned versions of the L2 files and are easier to use for maps and time series.
known_limitations: Clouds reduce usable data for most products; low sun and snow cover degrade the retrievals.
  Swath geometry in L2 files.
example_use_cases: Lockdown and traffic-related NO2 changes; methane super-emitter detection; volcanic
  SO2 plumes; CAMS validation.
