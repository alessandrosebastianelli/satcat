short_description: Daily global mapping of NO2, O3, SO2, CO, CH4, HCHO, aerosols and clouds at about 5.5
  x 3.5 km.
long_description: Sentinel-5 Precursor carries TROPOMI, a nadir-viewing imaging spectrometer covering
  the ultraviolet, visible, near-infrared and shortwave infrared. It was launched on 13 October 2017 and
  observes the whole globe daily at a ground pixel of 7 x 3.5 km, reduced to 5.5 x 3.5 km from August
  2019. It is the reference dataset for tropospheric NO2 and for satellite methane and carbon monoxide,
  and serves the Copernicus Atmosphere Monitoring Service.
