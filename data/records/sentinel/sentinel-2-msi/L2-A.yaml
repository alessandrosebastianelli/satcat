id: sentinel-2-msi-l2a
level: L2-A
level_summary: 'Level 2A: Bottom-of-atmosphere (BOA) surface reflectance — atmospheric correction already
  applied by ESA''s Sen2Cor processor, plus a Scene Classification (SCL) band for cloud/shadow/water masking.
  The level most analysis-ready workflows should start from.'
