download_snippet: "import ee\nee.Initialize()\n\ncollection = (\n    ee.ImageCollection(\"COPERNICUS/S2_SR_HARMONIZED\"\
  )\n    .filterBounds(ee.Geometry.Point(12.5, 41.9))\n    .filterDate(\"2024-06-01\", \"2024-06-30\"\
  )\n    .filter(ee.Filter.lt(\"CLOUDY_PIXEL_PERCENTAGE\", 20))\n)\nprint(collection.size().getInfo())\n"
download_snippet_lang: python
gee_snippet: "// Sentinel-2 Surface Reflectance, cloud-filtered, NDVI composite\nvar aoi = ee.Geometry.Point([12.5,\
  \ 41.9]);\n\nvar collection = ee.ImageCollection('COPERNICUS/S2_SR_HARMONIZED')\n  .filterBounds(aoi)\n\
  \  .filterDate('2024-06-01', '2024-08-31')\n  .filter(ee.Filter.lt('CLOUDY_PIXEL_PERCENTAGE', 20));\n\
  \nvar addNDVI = function(img) {\n  var ndvi = img.normalizedDifference(['B8', 'B4']).rename('NDVI');\n\
  \  return img.addBands(ndvi);\n};\n\nvar withNDVI = collection.map(addNDVI);\nvar ndviMedian = withNDVI.select('NDVI').median();\n\
  \nMap.centerObject(aoi, 10);\nMap.addLayer(ndviMedian, {min: 0, max: 1, palette: ['white', 'green']},\
  \ 'NDVI median');\n"
