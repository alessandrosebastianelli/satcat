download_snippet: "from sentinelhub import SHConfig, SentinelHubCatalog\n\nconfig = SHConfig()\ncatalog\
  \ = SentinelHubCatalog(config=config)\nsearch_iterator = catalog.search(\n    collection=\"sentinel-1-grd\"\
  ,\n    bbox=[12.4, 41.8, 12.6, 42.0],\n    time=(\"2024-01-01\", \"2024-02-01\"),\n)\nfor item in search_iterator:\n\
  \    print(item[\"id\"])\n"
download_snippet_lang: python
gee_snippet: "// Sentinel-1 GRD, VV polarization, IW mode, ascending orbit\nvar aoi = ee.Geometry.Point([12.5,\
  \ 41.9]);\n\nvar collection = ee.ImageCollection('COPERNICUS/S1_GRD')\n  .filterBounds(aoi)\n  .filterDate('2024-01-01',\
  \ '2024-03-01')\n  .filter(ee.Filter.eq('instrumentMode', 'IW'))\n  .filter(ee.Filter.listContains('transmitterReceiverPolarisation',\
  \ 'VV'))\n  .filter(ee.Filter.eq('orbitProperties_pass', 'ASCENDING'))\n  .select('VV');\n\nprint('Number\
  \ of images:', collection.size());\nMap.addLayer(collection.median(), {min: -20, max: 0}, 'Sentinel-1\
  \ VV (median)');\n"
