qa:
- question: Can I use GRD products directly for interferometry, or do I need SLC?
  asked_by: admin
  asked_at: 2026-01-10 09:00 UTC
  replies:
  - text: You need SLC (Single Look Complex) for InSAR — GRD has already lost the phase information during
      ground-range detection. Use GRD only for amplitude-based analyses (flood mapping, ship detection).
    by: admin
    at: 2026-01-10 11:20 UTC
  - text: To add — SNAP's InSAR tutorials all start from SLC for exactly this reason. If you're looking
      for a quick coherence check without full InSAR processing, the pre-computed Coherence Map product
      also works and saves time.
    by: admin
    at: 2026-01-11 08:45 UTC
