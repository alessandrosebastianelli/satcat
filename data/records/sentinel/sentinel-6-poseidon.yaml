id: sentinel-6-poseidon
mission_name: Sentinel-6 Michael Freilich
sensor_name: Poseidon-4 (radar altimeter)
agency: ESA / EUMETSAT / NASA / NOAA
mission_family: Sentinel
status: Active
launch_year: 2020
end_of_life_year: null
short_description: Reference radar altimetry mission for sea surface height, continuing the Jason series
  record used for global sea level rise monitoring.
long_description: Sentinel-6 Michael Freilich carries the Poseidon-4 radar altimeter and continues the
  reference sea-surface-height time series started by TOPEX/Poseidon and continued by the Jason series,
  now the backbone dataset for measuring global mean sea level rise. It flies a dual- frequency (Ku/C-band)
  altimeter along a repeating ground track rather than imaging a swath, so "coverage" here means a dense
  track network, not continuous imagery.
