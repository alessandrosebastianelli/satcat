short_description: Geostationary UV-VIS-NIR spectrometer for hourly air quality monitoring (NO2, O3, SO2,
  HCHO, aerosols) over Europe and North Africa.
long_description: Sentinel-4 is a hosted payload on the Meteosat Third Generation Sounder satellite MTG-S1
  (named Meteosat-13 in operations), launched on 1 July 2025. From geostationary orbit at 0 degrees longitude
  its UVN imaging spectrometer scans Europe and North Africa every hour, measuring trace gases (ozone,
  nitrogen dioxide, sulphur dioxide, formaldehyde, glyoxal) and aerosol and cloud properties from hyperspectral
  observations. It is the geostationary counterpart of Sentinel-5P and Sentinel-5. Sentinel-4 data are
  expected to enter operational release in 2027; check the EUMETSAT Data Store and the Copernicus Data
  Space for the current availability.
