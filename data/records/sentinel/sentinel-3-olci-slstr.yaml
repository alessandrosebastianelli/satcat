short_description: Ocean/land color (OLCI) and dual-view thermal (SLSTR) constellation, built primarily
  for ocean and large-scale land/vegetation monitoring.
long_description: 'Sentinel-3 combines two main instruments: OLCI (Ocean and Land Colour Instrument),
  a 21-band medium-resolution optical imager descended from ENVISAT''s MERIS, and SLSTR (Sea and Land
  Surface Temperature Radiometer), a dual-view thermal instrument for accurate sea/land surface temperature.
  It also carries a radar altimeter for sea surface height. Coarser resolution than Sentinel-2 (300 m
  OLCI, 500m-1km SLSTR) but with daily-to-sub-daily global revisit, making it complementary rather than
  a substitute for Sentinel-2 in land applications.'
