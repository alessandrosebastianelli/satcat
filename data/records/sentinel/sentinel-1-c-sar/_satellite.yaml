short_description: C-band synthetic aperture radar constellation, the main operational source for interferometry
  (ground deformation) and all-weather day/night monitoring.
long_description: Sentinel-1 is a constellation of C-band SAR satellites operated by ESA under the Copernicus
  programme. Because SAR is independent of cloud cover and solar illumination, it is the reference source
  for ground deformation monitoring (landslides, subsidence, earthquakes), flood mapping, and maritime
  surveillance. Sentinel-1A has been operational since 2014; Sentinel-1B stopped transmitting in December
  2021 due to a failure, temporarily reducing revisit frequency until Sentinel-1C launched in December
  2024 and restored the two-satellite constellation.
