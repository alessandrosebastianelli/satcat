id: sentinel-1-c-sar-l1
level: L1
level_summary: 'Level 1: SLC (Single Look Complex, phase-preserved) or GRD (Ground Range Detected, amplitude-only,
  geocoded). SLC is required for InSAR; GRD is the more commonly distributed, browser-friendly product.'
bands:
- name: C-band (VV/VH, HH/HV depending on mode)
  wavelength_or_frequency: 5.405 GHz
  spatial_resolution: 5-20 m (IW mode)
  resolution_m: 5.0
  frequency_ghz: 5.405
  typical_use: Ground deformation (InSAR), flood/ship detection
spatial_resolution_summary: 5x20 m in Interferometric Wide (IW) mode, the most commonly used
processing_level:
- L1B
- L1C
derivable_products:
- SAR Displacement (InSAR)
- Coherence Map (SAR)
- Flood Mapping
- Ship Detection
measured_variables:
- Ground deformation
data_format:
- SAFE (Sentinel)
- GeoTIFF
temporal_range_start: 2014
temporal_range_end: null
data_latency: Fast (< 1 day)
access_url: https://dataspace.copernicus.eu/browser/?productType=S1_SLC
requires_registration: true
license_cost: Free (Open Data - Copernicus)
api_type:
- STAC API
- REST
- Python SDK
documentation_url: https://sentiwiki.copernicus.eu/web/s1-mission
download_snippet: "from sentinelhub import SHConfig, SentinelHubCatalog\n\nconfig = SHConfig()\ncatalog\
  \ = SentinelHubCatalog(config=config)\nsearch_iterator = catalog.search(\n    collection=\"sentinel-1-grd\"\
  ,\n    bbox=[12.4, 41.8, 12.6, 42.0],\n    time=(\"2024-01-01\", \"2024-02-01\"),\n)\nfor item in search_iterator:\n\
  \    print(item[\"id\"])\n"
download_snippet_lang: python
gee_snippet: "// Sentinel-1 GRD, VV polarization, IW mode, ascending orbit\nvar aoi = ee.Geometry.Point([12.5,\
  \ 41.9]);\n\nvar collection = ee.ImageCollection('COPERNICUS/S1_GRD')\n  .filterBounds(aoi)\n  .filterDate('2024-01-01',\
  \ '2024-03-01')\n  .filter(ee.Filter.eq('instrumentMode', 'IW'))\n  .filter(ee.Filter.listContains('transmitterReceiverPolarisation',\
  \ 'VV'))\n  .filter(ee.Filter.eq('orbitProperties_pass', 'ASCENDING'))\n  .select('VV');\n\nprint('Number\
  \ of images:', collection.size());\nMap.addLayer(collection.median(), {min: -20, max: 0}, 'Sentinel-1\
  \ VV (median)');\n"
related_datasets:
- sentinel-2-msi-l2a
internal_projects: Not yet used in a specific internal project — flag here once it is.
notes: 'Note: since 2023 data access has migrated from the old Copernicus Open Access Hub to the new Copernicus
  Data Space Ecosystem — old links/REST endpoints no longer work. For interferometry, start from SLC data
  (not GRD).'
known_limitations: Speckle noise requires filtering before most analyses. Radiometric terrain correction
  (RTC) is not applied by default on GRD products — apply it yourself for quantitative backscatter comparisons
  across different terrain.
example_use_cases: Landslide and subsidence monitoring via InSAR time series; flood extent mapping during/after
  heavy rain events; ship detection in coastal waters.
extra_sections:
- title: SLC vs GRD, quick reference
  content: SLC keeps phase (needed for InSAR), single-polarization complex pixels, not map-projected.
    GRD is amplitude-only, multi-looked, map-projected, and much easier to view directly — use GRD unless
    you specifically need interferometry.
qa:
- question: Can I use GRD products directly for interferometry, or do I need SLC?
  asked_by: Alessandro Sebastianelli
  asked_at: 2026-01-10 09:00 UTC
  replies:
  - text: You need SLC (Single Look Complex) for InSAR — GRD has already lost the phase information during
      ground-range detection. Use GRD only for amplitude-based analyses (flood mapping, ship detection).
    by: Alessandro Sebastianelli
    at: 2026-01-10 11:20 UTC
  - text: To add — SNAP's InSAR tutorials all start from SLC for exactly this reason. If you're looking
      for a quick coherence check without full InSAR processing, the pre-computed Coherence Map product
      also works and saves time.
    by: Alessandro Sebastianelli
    at: 2026-01-11 08:45 UTC
