mission_name: Sentinel-3
sensor_name: SLSTR (Sea and Land Surface Temperature Radiometer)
agency: ESA / EUMETSAT / Copernicus
mission_family: Sentinel
status: Active
launch_year: 2016
end_of_life_year: null
short_description: Dual-view radiometer measuring sea and land surface temperature to about 0.3 K accuracy,
  plus active fire and aerosol products.
long_description: SLSTR is a conical-scanning radiometer on the Sentinel-3 satellites with 9 spectral
  bands from the visible to the thermal infrared, plus two dedicated fire channels (F1 and F2). It observes
  each point on the ground twice, at nadir and at an oblique angle (about 55 degrees), which improves
  atmospheric correction for surface temperature. Visible and shortwave bands have 500 m pixels and thermal
  bands 1 km. It continues the ENVISAT AATSR series and underpins the Copernicus climate-quality sea surface
  temperature record.
