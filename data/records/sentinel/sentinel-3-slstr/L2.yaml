snippets:
- title: Python
  lang: python
  description: Downloads the 1 km land surface temperature layer of one SLSTR LST product from the Planetary
    Computer (no account needed) and plots it in swath geometry.
  requirements:
  - pystac-client
  - planetary-computer
  - xarray
  - netCDF4
  - requests
  - matplotlib
  code: |
    import matplotlib.pyplot as plt
    import numpy as np
    import planetary_computer
    import pystac_client
    import requests
    import xarray as xr

    catalog = pystac_client.Client.open(
        "https://planetarycomputer.microsoft.com/api/stac/v1",
        modifier=planetary_computer.sign_inplace,
    )



    search = catalog.search(
        collections=["sentinel-3-slstr-lst-l2-netcdf"],
        bbox=[12.4, 41.8, 12.6, 42.0],                      # Rome - change to your area
        datetime="2024-06-01/2024-06-05",
    )
    items = search.item_collection()
    if not items:
        raise SystemExit("No products found - widen the dates or the bounding box")
    item = items[0]
    print(len(items), "products; using", item.id)

    with requests.get(item.assets["lst-in"].href, stream=True) as r:
        r.raise_for_status()
        with open("lst.nc", "wb") as f:
            for chunk in r.iter_content(chunk_size=1 << 20):
                f.write(chunk)

    ds = xr.open_dataset("lst.nc")
    print(ds)
    lst = ds["LST"] if "LST" in ds else ds[list(ds.data_vars)[0]]
    lst.plot(cmap="inferno")                   # kelvin, swath geometry
    plt.title(item.id)
    plt.show()
- title: Original Method
  lang: bash
  description: Official Copernicus Data Space Ecosystem OData API; the same service is also reachable
    from the browser Copernicus Browser.
  code: |
    # SLSTR Level-2 Land Surface Temperature (SL_2_WST for sea, SL_2_FRP for fires)
    # 1) Search the catalogue (OData) - no login needed
    curl -s -G "https://catalogue.dataspace.copernicus.eu/odata/v1/Products" \
      --data-urlencode "\$filter=Collection/Name eq 'SENTINEL-3' and contains(Name,'SL_2_LST') and ContentDate/Start gt 2024-06-01T00:00:00.000Z and ContentDate/Start lt 2024-06-03T00:00:00.000Z" \
      --data-urlencode "\$top=3" | python3 -m json.tool

    # 2) Get an access token (free account at dataspace.copernicus.eu)
    TOKEN=$(curl -s -d "client_id=cdse-public" -d "username=YOUR_EMAIL" -d "password=YOUR_PASSWORD" \
      -d "grant_type=password" \
      "https://identity.dataspace.copernicus.eu/auth/realms/CDSE/protocol/openid-connect/token" \
      | python3 -c "import sys, json; print(json.load(sys.stdin)['access_token'])")

    # 3) Download a product by the Id found in step 1
    curl -H "Authorization: Bearer $TOKEN" -L -o product.zip \
      "https://download.dataspace.copernicus.eu/odata/v1/Products(PRODUCT_ID)/\$value"
