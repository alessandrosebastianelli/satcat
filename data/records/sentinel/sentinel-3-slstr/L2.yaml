internal_projects: Not yet used in a specific internal project - flag here once it is.
notes: LST is given in kelvin. Sea surface temperature (WST) products are distributed by EUMETSAT as well
  as the Copernicus Data Space.
known_limitations: Cloud-contaminated pixels must be masked with the product flags; the 1 km grid is in
  swath geometry. Land LST accuracy depends on the emissivity of the surface type.
example_use_cases: Urban heat island studies; day/night land surface temperature; sea surface temperature
  for marine heat waves; fire detection.
