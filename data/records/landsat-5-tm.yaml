id: landsat-5-tm
mission_name: Landsat 5
sensor_name: TM (Thematic Mapper)
agency: NASA / USGS
mission_family: Landsat
status: Decommissioned
launch_year: 1984
end_of_life_year: 2013
short_description: Longest-operating Earth observation satellite in history (29 years), same Thematic
  Mapper instrument as Landsat 4.
long_description: Landsat 5 holds the Guinness World Record for the longest-operating Earth observation
  satellite, providing an uninterrupted 30 m archive from 1984 to 2013 — a backbone dataset for global
  land change studies (deforestation, urban growth, agriculture) spanning nearly three decades with a
  single consistent instrument design.
