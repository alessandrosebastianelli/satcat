id: landsat-7-etm-plus
mission_name: Landsat 7
sensor_name: ETM+ (Enhanced Thematic Mapper Plus)
agency: NASA / USGS
mission_family: Landsat
status: Active
launch_year: 1999
end_of_life_year: null
short_description: Added a 15 m panchromatic band and onboard calibration to the TM design; still operating
  today but affected by a scan line corrector failure since 2003 that leaves data gaps in each scene.
long_description: Landsat 7's ETM+ improved on Landsat 4/5's TM with a 15 m panchromatic band, better
  radiometric calibration, and a higher-resolution thermal band (60 m vs 120 m). In May 2003 its Scan
  Line Corrector (SLC) failed, causing a "zig-zag" wedge pattern of missing data (~22% of each scene)
  that remains present in every acquisition since — data is still useful, especially with gap-filling
  algorithms, but must be handled explicitly unlike gap-free sensors. Landsat 7 has been in a lowered/drifting
  orbit since 2022 to preserve fuel, coordinated with Landsat 9's orbit.
