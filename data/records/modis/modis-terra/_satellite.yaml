short_description: '36-band imager at 250 m to 1 km with daily global coverage: the reference for land,
  ocean and atmosphere products from 2000. Morning (10:30) satellite.'
long_description: MODIS flies on the NASA Terra satellite (launched 1999), part of the Earth Observing
  System. It measures 36 spectral bands from 0.4 to 14.4 um at 250 m (2 bands), 500 m (5 bands) and 1
  km (29 bands) with a 2330 km swath, giving near-daily global coverage. Terra was launched on 18 December
  1999 into a morning (10:30 descending) orbit. NASA plans to end Terra science data collection between
  late 2026 and February 2027 (check the LAADS DAAC MODIS-to-VIIRS transition page for the current date).
  Both platforms have been drifting out of their nominal orbits since fuel ran low, so overpass times
  and view geometry now change over time. NASA will end MODIS observations in the coming years and recommends
  moving to VIIRS for continuity.
