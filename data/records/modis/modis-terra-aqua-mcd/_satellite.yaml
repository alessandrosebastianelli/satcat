mission_name: Terra + Aqua (combined)
sensor_name: MODIS combined products (MCD)
agency: NASA
mission_family: MODIS
status: Active
launch_year: 2000
end_of_life_year: null
short_description: 'MODIS products that merge Terra and Aqua observations (MCD prefix): BRDF-corrected
  reflectance, burned area, land cover, LAI/FPAR and MAIAC aerosol.'
long_description: The MCD products combine the observations of both MODIS instruments to improve data
  quality and temporal coverage. Examples are MCD43 (BRDF/albedo and nadir BRDF-adjusted reflectance,
  NBAR), MCD64A1 (burned area), MCD12Q1 (yearly land cover), MCD15A2H/A3H (LAI and FPAR) and MCD19A2 (MAIAC
  aerosol and surface reflectance at 1 km). They are usually preferred over single-platform products for
  climate and land cover studies. Data stop when Terra and Aqua end their MODIS acquisitions (planned
  for 2026-2027); a VIIRS continuation is available.
instrument_type: Optical - Multispectral/thermal imager (36 bands)
