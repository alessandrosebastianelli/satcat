notes: LAI/FPAR is retrieved from surface reflectance with a look-up-table algorithm and a backup empirical
  NDVI relation when the main algorithm fails; check the FparLai_QC layer.
known_limitations: Saturation of LAI at high canopy density; cloud contamination in humid regions.
