snippets:
- title: Python
  lang: python
  description: Searches NASA Earthdata for the combined MCD15A3H LAI tile over Rome, downloads it (needs
    a free Earthdata login, asked at run time) and plots LAI. The tile is in sinusoidal projection (shown
    in pixel coordinates).
  requirements:
  - earthaccess
  - pyhdf
  - matplotlib
  - numpy
  code: |
    from pathlib import Path

    import earthaccess
    import matplotlib.pyplot as plt
    import numpy as np
    from pyhdf.SD import SD, SDC

    earthaccess.login()   # asks for a (free) NASA Earthdata Login the first time

    results = earthaccess.search_data(
        short_name="MCD15A3H",
        version="061",
        bounding_box=(12.2, 41.7, 12.8, 42.1),       # west, south, east, north (central Italy)
        temporal=("2024-07-01", "2024-07-05"),
    )
    print(len(results), "granules found")
    files = earthaccess.download(results[:1], "data")
    path = Path(files[0])

    hdf = SD(str(path), SDC.READ)
    print(sorted(hdf.datasets()))

    sds = hdf.select("Lai_500m")
    raw = sds[:, :].astype("float32")
    raw[raw > 100] = np.nan                           # fill / invalid values
    data = raw * 0.1
    plt.imshow(data, cmap="inferno")
    plt.colorbar(label="LAI (m2/m2)")
    plt.title(path.name)
    plt.show()
- title: Google Earth Engine
  lang: javascript
  code: |
    // Combined Terra+Aqua 4-day LAI (MCD15A3H)
    var aoi = ee.Geometry.Point([12.5, 41.9]);

    var lai = ee.ImageCollection('MODIS/061/MCD15A3H')
      .filterDate('2024-06-01', '2024-08-31')
      .select('Lai')
      .mean()
      .multiply(0.1);

    Map.centerObject(aoi, 7);
    Map.addLayer(lai, {min: 0, max: 6, palette: ['white', 'green']}, 'LAI summer 2024');
- title: Original Method
  lang: bash
  description: Official NASA LAADS DAAC archive. The same data can be searched in NASA Earthdata Search
    or through the earthaccess Python library.
  code: |
    # Combined MODIS Level-4 LAI/FPAR 4-day (MCD15A3H)
    # 1) Create a token in your free NASA Earthdata profile: https://ladsweb.modaps.eosdis.nasa.gov/profile/#app-keys
    TOKEN="YOUR_EARTHDATA_TOKEN"

    # 2) Mirror one day of data (day-of-year 153 = 1 June 2024). Collection 6.1 is the "61" folder.
    wget -e robots=off -m -np -nH --cut-dirs=4 -A "*h18v04*" \
      --header "Authorization: Bearer $TOKEN" -P data \
      "https://ladsweb.modaps.eosdis.nasa.gov/archive/allData/61/MCD15A3H/2024/153/"
    # h18v04 is the sinusoidal tile that contains Rome; use the MODIS tile calculator for others
