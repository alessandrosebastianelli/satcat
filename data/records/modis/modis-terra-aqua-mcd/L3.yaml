snippets:
- title: Python
  lang: python
  description: Searches the Microsoft Planetary Computer STAC catalogue (no account needed) for the daily
    MCD43A4 nadir BRDF-adjusted reflectance tile over Rome and plots band 1 (red).
  requirements:
  - pystac-client
  - planetary-computer
  - rioxarray
  - matplotlib
  code: |
    import matplotlib.pyplot as plt
    import numpy as np
    import planetary_computer
    import pystac_client
    import rioxarray

    catalog = pystac_client.Client.open(
        "https://planetarycomputer.microsoft.com/api/stac/v1",
        modifier=planetary_computer.sign_inplace,
    )


    def open_overview(href, level=2):
        """Open a COG at reduced resolution (fast), falling back to full resolution."""
        try:
            return rioxarray.open_rasterio(href, overview_level=level, masked=True).squeeze()
        except Exception:
            return rioxarray.open_rasterio(href, masked=True).squeeze()

    search = catalog.search(
        collections=["modis-43A4-061"],
        bbox=[12.4, 41.8, 12.6, 42.0],                      # Rome - change to your area
        datetime="2024-07-01/2024-07-05",
    )
    items = [i for i in search.item_collection() if i.id.startswith("MCD43A4")]
    if not items:
        raise SystemExit("No tiles found - widen the dates or the bounding box")
    item = items[0]
    print(len(items), "tiles;", "using", item.id, item.datetime)
    print("assets:", sorted(item.assets))

    key = next((k for k in item.assets if "Band1" in k), None)
    if key is None:
        raise SystemExit("No asset containing 'Band1' - pick one from the list above")
    data = open_overview(item.assets[key].href, level=1) * 0.0001
    data.plot(cmap="inferno" if "V" == "K" else "YlGn")
    plt.title(item.id + " - " + key + " (NBAR red reflectance)")
    plt.show()
- title: Google Earth Engine
  lang: javascript
  code: |
    // Combined Terra+Aqua: yearly land cover (MCD12Q1) and monthly burned area (MCD64A1)
    var aoi = ee.Geometry.Point([12.5, 41.9]);

    var landCover = ee.ImageCollection('MODIS/061/MCD12Q1')
      .filterDate('2022-01-01', '2022-12-31')
      .first()
      .select('LC_Type1');          // IGBP classification

    var burned = ee.ImageCollection('MODIS/061/MCD64A1')
      .filterDate('2023-07-01', '2023-08-31')
      .select('BurnDate')
      .max();

    Map.centerObject(aoi, 6);
    Map.addLayer(landCover, {min: 1, max: 17, palette: ['05450a', '086a10', '54a708', '78d203', '009900', 'c6b044', 'dcd159', 'dade48', 'fbff13', 'b6ff05', '27ff87', 'c24f44', 'a5a5a5', 'ff6d4c', '69fff8', 'f9ffa4', '1c0dff']}, 'Land cover IGBP');
    Map.addLayer(burned.selfMask(), {palette: ['red']}, 'Burned area');
- title: Original Method
  lang: bash
  description: Official NASA LAADS DAAC archive. The same data can be searched in NASA Earthdata Search
    or through the earthaccess Python library.
  code: |
    # Combined MODIS Level-3 NBAR reflectance (MCD43A4)
    # 1) Create a token in your free NASA Earthdata profile: https://ladsweb.modaps.eosdis.nasa.gov/profile/#app-keys
    TOKEN="YOUR_EARTHDATA_TOKEN"

    # 2) Mirror one day of data (day-of-year 153 = 1 June 2024). Collection 6.1 is the "61" folder.
    wget -e robots=off -m -np -nH --cut-dirs=4 -A "*h18v04*" \
      --header "Authorization: Bearer $TOKEN" -P data \
      "https://ladsweb.modaps.eosdis.nasa.gov/archive/allData/61/MCD43A4/2024/153/"
    # h18v04 is the sinusoidal tile that contains Rome; use the MODIS tile calculator for others
