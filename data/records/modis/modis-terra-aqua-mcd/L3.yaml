internal_projects: Not yet used in a specific internal project - flag here once it is.
notes: MCD43 uses a 16-day window centred on the day of interest, so it is temporally smooth but not strictly
  a daily observation. Burned area (MCD64A1) is monthly and the standard for global fire statistics.
known_limitations: The temporal window blurs rapid changes; MCD products end with the MODIS record; MCD12Q1
  land cover is coarse (500 m) and class definitions are global.
