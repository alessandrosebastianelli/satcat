notes: Always download the geolocation file (MYD03) together with MYD021KM. For quick-look and most science
  use, the L2/L3 products below are easier.
known_limitations: Swath data with large pixels at the scan edge (bow-tie effect), large files (hundreds
  of MB per 5-minute granule), HDF4 format.
