snippets:
- title: Python
  lang: python
  description: Searches NASA Earthdata for a MYD021KM granule over central Italy, downloads it (needs
    a free Earthdata login, asked at run time) and plots band 1 (red) reflectance. HDF4 files are read
    with pyhdf.
  requirements:
  - earthaccess
  - pyhdf
  - matplotlib
  - numpy
  code: |
    from pathlib import Path

    import earthaccess
    import matplotlib.pyplot as plt
    import numpy as np
    from pyhdf.SD import SD, SDC

    earthaccess.login()   # asks for a (free) NASA Earthdata Login the first time

    results = earthaccess.search_data(
        short_name="MYD021KM",
        version="61",
        bounding_box=(12.0, 41.0, 13.0, 42.5),       # west, south, east, north (central Italy)
        temporal=("2024-06-01", "2024-06-02"),
    )
    print(len(results), "granules found")
    files = earthaccess.download(results[:1], "data")
    path = Path(files[0])

    hdf = SD(str(path), SDC.READ)
    print(sorted(hdf.datasets()))

    sds = hdf.select("EV_250_Aggr1km_RefSB")
    attrs = sds.attributes()
    dn = sds[0, :, :].astype("float32")
    refl = (dn - attrs["reflectance_offsets"][0]) * attrs["reflectance_scales"][0]
    refl[dn > 32767] = np.nan                         # fill / invalid values
    plt.imshow(refl, cmap="gray", vmin=0, vmax=np.nanpercentile(refl, 98))
    plt.colorbar(label="reflectance")
    plt.title(path.name + " - band 1 reflectance")
    plt.show()
- title: Original Method
  lang: bash
  description: Official NASA LAADS DAAC archive. The same data can be searched in NASA Earthdata Search
    or through the earthaccess Python library.
  code: |
    # Aqua MODIS Level-1B calibrated radiances (collection 6.1)
    # 1) Create a token in your free NASA Earthdata profile: https://ladsweb.modaps.eosdis.nasa.gov/profile/#app-keys
    TOKEN="YOUR_EARTHDATA_TOKEN"

    # 2) Mirror one day of data (day-of-year 153 = 1 June 2024). Collection 6.1 is the "61" folder.
    wget -e robots=off -m -np -nH --cut-dirs=4 -A "*.hdf" \
      --header "Authorization: Bearer $TOKEN" -P data \
      "https://ladsweb.modaps.eosdis.nasa.gov/archive/allData/61/MYD021KM/2024/153/"
    # h18v04 is the sinusoidal tile that contains Rome; use the MODIS tile calculator for others
