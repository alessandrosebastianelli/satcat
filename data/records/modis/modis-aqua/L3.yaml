snippets:
- title: Python
  lang: python
  description: Searches the Microsoft Planetary Computer STAC catalogue (no account needed) for the daily
    MYD11A1 land surface temperature tile over Rome and plots daytime LST in kelvin.
  requirements:
  - pystac-client
  - planetary-computer
  - rioxarray
  - matplotlib
  code: |
    import matplotlib.pyplot as plt
    import numpy as np
    import planetary_computer
    import pystac_client
    import rioxarray

    catalog = pystac_client.Client.open(
        "https://planetarycomputer.microsoft.com/api/stac/v1",
        modifier=planetary_computer.sign_inplace,
    )


    def open_overview(href, level=2):
        """Open a COG at reduced resolution (fast), falling back to full resolution."""
        try:
            return rioxarray.open_rasterio(href, overview_level=level, masked=True).squeeze()
        except Exception:
            return rioxarray.open_rasterio(href, masked=True).squeeze()

    search = catalog.search(
        collections=["modis-11A1-061"],
        bbox=[12.4, 41.8, 12.6, 42.0],                      # Rome - change to your area
        datetime="2024-07-01/2024-07-10",
    )
    items = [i for i in search.item_collection() if i.id.startswith("MYD11A1")]
    if not items:
        raise SystemExit("No tiles found - widen the dates or the bounding box")
    item = items[0]
    print(len(items), "tiles;", "using", item.id, item.datetime)
    print("assets:", sorted(item.assets))

    key = next((k for k in item.assets if "LST_Day" in k), None)
    if key is None:
        raise SystemExit("No asset containing 'LST_Day' - pick one from the list above")
    data = open_overview(item.assets[key].href, level=1) * 0.02
    data.plot(cmap="inferno" if "K" == "K" else "YlGn")
    plt.title(item.id + " - " + key + " (land surface temperature (K))")
    plt.show()
- title: Google Earth Engine
  lang: javascript
  code: |
    // Aqua MODIS: daytime land surface temperature (MOD11A1/MYD11A1, 1 km) and NDVI (250 m, 16 day)
    var aoi = ee.Geometry.Point([12.5, 41.9]);

    var lst = ee.ImageCollection('MODIS/061/MYD11A1')
      .filterDate('2024-07-01', '2024-07-31')
      .select('LST_Day_1km')
      .mean()
      .multiply(0.02)
      .subtract(273.15);            // kelvin to Celsius

    var ndvi = ee.ImageCollection('MODIS/061/MYD13Q1')
      .filterDate('2024-07-01', '2024-07-31')
      .select('NDVI')
      .mean()
      .multiply(0.0001);

    Map.centerObject(aoi, 7);
    Map.addLayer(lst, {min: 15, max: 45, palette: ['blue', 'white', 'red']}, 'LST day (C)');
    Map.addLayer(ndvi, {min: 0, max: 0.9, palette: ['white', 'green']}, 'NDVI');
- title: Original Method
  lang: bash
  description: Official NASA LAADS DAAC archive. The same data can be searched in NASA Earthdata Search
    or through the earthaccess Python library.
  code: |
    # Aqua MODIS Level-3 daily land surface temperature tiles (LP DAAC mirror on LAADS)
    # 1) Create a token in your free NASA Earthdata profile: https://ladsweb.modaps.eosdis.nasa.gov/profile/#app-keys
    TOKEN="YOUR_EARTHDATA_TOKEN"

    # 2) Mirror one day of data (day-of-year 153 = 1 June 2024). Collection 6.1 is the "61" folder.
    wget -e robots=off -m -np -nH --cut-dirs=4 -A "*h18v04*" \
      --header "Authorization: Bearer $TOKEN" -P data \
      "https://ladsweb.modaps.eosdis.nasa.gov/archive/allData/61/MYD11A1/2024/153/"
    # h18v04 is the sinusoidal tile that contains Rome; use the MODIS tile calculator for others
