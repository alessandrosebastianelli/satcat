notes: 'Scale factors differ per product: LST x 0.02 (K), NDVI/EVI and reflectance x 0.0001. Check the
  quality (QC) layers: MODIS ships bit-packed QC bands for every science dataset. Collection 6.1 is the
  current reprocessing.'
known_limitations: 'Sinusoidal tiles of 10 degrees: mosaicking and reprojection are needed over large
  areas. Terra and Aqua now have drifting overpass times, which affects daily LST and BRDF-sensitive products.'
