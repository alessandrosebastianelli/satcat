internal_projects: Not yet used in a specific internal project - flag here once it is.
notes: GPP/NPP are model outputs driven by FPAR from MODIS and meteorological reanalysis (GMAO). Use the
  gap-filled versions (e.g. 16A2GF, 17A3HGF) for annual analyses.
known_limitations: 'Model-based products: uncertainty depends on the meteorological inputs and on the
  land cover map. Cloud contamination affects LAI/FPAR especially in the tropics.'
