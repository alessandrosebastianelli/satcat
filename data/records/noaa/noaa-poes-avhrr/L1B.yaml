snippets:
- title: Python
  lang: python
  description: Reads a local AVHRR L1B (GAC/LAC) file ordered from NOAA CLASS with satpy and plots channel
    4. Without a file in ./data it only prints instructions, because L1B data must be ordered first.
  requirements:
  - satpy
  - pygac
  - matplotlib
  code: |
    from glob import glob

    import matplotlib.pyplot as plt
    from satpy import Scene

    # AVHRR L1B files ordered from NOAA CLASS (or received by direct broadcast) go in ./data
    files = sorted(glob("data/**/*", recursive=True))
    files = [f for f in files if "NSS.GHRR" in f or "NSS.LHRR" in f or f.endswith(".l1b")]
    if not files:
        print("No AVHRR L1B file found in ./data: order one from NOAA CLASS (see the Original Method tab) and re-run")
    else:
        scn = Scene(filenames=files[:1], reader="avhrr_l1b_gaclac")
        scn.load(["4"])
        scn["4"].plot(cmap="gray_r")
        plt.title("AVHRR channel 4 (10.8 um)")
        plt.show()
- title: Original Method
  lang: bash
  description: NOAA CLASS is the official archive for the POES L1B record.
  code: |
    # 1. Create a free account at https://www.class.noaa.gov and search "AVHRR" (GAC / LAC / HRPT, satellite NOAA-15..19)
    # 2. Place the order (small orders are delivered by FTP/HTTPS) and download the files into ./data
    # 3. GAC files can be read with pygac / satpy; reprocessed AVHRR GAC FCDRs are also available from CM SAF / NCEI
related_datasets:
- metop-avhrr-l1b
- noaa-poes-avhrr-l3
- jpss-viirs-l1b
internal_projects: Not yet used in a specific internal project - flag here once it is.
notes: Reprocessed AVHRR GAC fundamental climate data records (for example from the CM SAF) are better
  suited to time series than operational L1B.
known_limitations: Orbit drift and sensor degradation create trends in long records; calibration changes
  between satellites; archive requires an order.
example_use_cases: Long SST, vegetation and snow records; cloud climatologies; bridging to MODIS and VIIRS.
