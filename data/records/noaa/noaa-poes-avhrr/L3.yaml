internal_projects: Not yet used in a specific internal project - flag here once it is.
notes: 'Earth Engine collection IDs: NOAA/CDR/AVHRR/NDVI/V5 and NOAA/CDR/AVHRR/SR/V5 (surface reflectance);
  verify the version in the Earth Engine catalog.'
known_limitations: Coarse resolution; cloud and aerosol contamination in daily data; sensor and orbit
  differences between satellites.
example_use_cases: Multi-decade vegetation trends; comparison with MODIS/VIIRS NDVI.
