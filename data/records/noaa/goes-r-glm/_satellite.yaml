mission_name: GOES-R series (GOES-16, -18, -19)
sensor_name: GLM (Geostationary Lightning Mapper)
agency: NOAA / NASA
mission_family: GOES-R
status: Active
launch_year: 2016
end_of_life_year: null
short_description: Continuous optical lightning detection (777.4 nm) over the Americas and adjacent oceans
  at about 8 km, 2 ms frame rate; reports events, groups and flashes.
long_description: GLM detects total lightning (intracloud and cloud-to-ground) in the oxygen line near
  777.4 nm, day and night, with a 1372 x 1300 pixel CCD at 500 frames per second. It flies on GOES-16,
  -18 and -19. It complements the Lightning Imager on MTG.
instrument_type: Optical - single-band lightning mapper (777.4 nm)
