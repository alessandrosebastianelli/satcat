internal_projects: Not yet used in a specific internal project - flag here once it is.
notes: Gridded GLM products (flash extent density) are derived by NOAA and by community tools such as
  glmtools.
known_limitations: Detection efficiency varies with location and cloud; parallax affects flash locations;
  GLM files are small but numerous.
example_use_cases: Severe storm nowcasting; lightning climatology; wildfire ignition from lightning.
