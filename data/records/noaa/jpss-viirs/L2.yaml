snippets:
- title: Python
  lang: python
  description: Searches NASA CMR for one VIIRS thermal anomalies (fire) granule over Rome, downloads it
    with an Earthdata Login and plots the fire mask (or the first 2D variable).
  requirements:
  - earthaccess
  - xarray
  - netCDF4
  - h5netcdf
  - matplotlib
  code: |
    import earthaccess
    import matplotlib.pyplot as plt
    import xarray as xr

    earthaccess.login()                              # NASA Earthdata Login (free account), interactive
    results = earthaccess.search_data(short_name="VNP14", temporal=("2024-06-01", "2024-06-01"),
                                      bounding_box=(12.0, 41.0, 13.0, 42.5), count=1)
    print(len(results), "granule(s)")
    files = earthaccess.download(results, "data")

    ds = xr.open_dataset(files[0])
    print(ds)
    two_d = [n for n, v in ds.data_vars.items() if v.ndim == 2]
    print(two_d)
    ds["fire mask" if "fire mask" in ds else two_d[0]].plot()
    plt.show()
- title: Original Method
  lang: bash
  description: VNP14 (Suomi NPP fire). Use VJ114 for NOAA-20 and VJ214 for NOAA-21.
  code: |
    # NASA LAADS DAAC (Earthdata token required)
    TOKEN="YOUR_EARTHDATA_TOKEN"
    wget -e robots=off -m -np -nH --cut-dirs=4 -A ".nc" --header "Authorization: Bearer $TOKEN" \
      "https://ladsweb.modaps.eosdis.nasa.gov/archive/allData/5200/VNP14/2024/153/" -P data
