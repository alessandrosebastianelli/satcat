snippets:
- title: Python
  lang: python
  description: Annual NDVI time series at a point near Rome from the VIIRS VNP13A1 collection in Google
    Earth Engine (needs a Google Cloud project with Earth Engine enabled).
  requirements:
  - earthengine-api
  - pandas
  - matplotlib
  code: |
    import ee
    import matplotlib.pyplot as plt
    import pandas as pd

    ee.Authenticate()                                # opens a browser/Colab login the first time
    PROJECT = input("Google Cloud project ID registered for Earth Engine: ")
    ee.Initialize(project=PROJECT)

    point = ee.Geometry.Point([12.5, 41.9])
    ic = ee.ImageCollection("NASA/VIIRS/002/VNP13A1").filterDate("2023-01-01", "2023-12-31").select("NDVI")
    feats = ic.map(lambda im: ee.Feature(None, {"date": im.date().format("YYYY-MM-dd"),
                                                "ndvi": im.reduceRegion(ee.Reducer.mean(), point, 500).get("NDVI")}))
    rows = [f["properties"] for f in feats.getInfo()["features"]]
    df = pd.DataFrame(rows).dropna()
    df["date"] = pd.to_datetime(df["date"])
    df["ndvi"] = df["ndvi"] * 0.0001                 # scale factor
    df.set_index("date")["ndvi"].plot(marker="o")
    plt.title("VIIRS VNP13A1 NDVI, Rome, 2023")
    plt.show()
- title: Google Earth Engine
  lang: javascript
  description: Summer median NDVI from VNP13A1 (500 m, 8-day cadence, 16-day composites). NDVI is scaled
    by 0.0001.
  code: |
    var ndvi = ee.ImageCollection("NASA/VIIRS/002/VNP13A1").filterDate("2023-06-01", "2023-09-01").select("NDVI").median();
    Map.setCenter(12.5, 41.9, 6);
    Map.addLayer(ndvi.multiply(0.0001), {min: 0, max: 0.9, palette: ["white", "green"]}, "VIIRS NDVI (summer 2023)");
