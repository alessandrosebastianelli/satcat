internal_projects: Not yet used in a specific internal project - flag here once it is.
notes: 'NASA short names: VNP02MOD/VNP02IMG/VNP03MOD (Suomi NPP), VJ102MOD/VJ102IMG (NOAA-20), VJ202MOD/VJ202IMG
  (NOAA-21). NOAA also distributes SDR/EDR on AWS (noaa-nesdis-*-pds).'
known_limitations: Large granules (6 minutes each); the netCDF groups require group= when opening; Suomi
  NPP data delivery ceased on 2 November 2026.
example_use_cases: Fire detection; cloud and SST monitoring; night lights; continuation of MODIS.
