snippets:
- title: Python
  lang: python
  description: Searches NASA CMR for one VIIRS L1B granule (Suomi NPP, VNP02MOD) over Rome, downloads
    it with an Earthdata Login and plots M15. Use VJ102MOD for NOAA-20 and VJ202MOD for NOAA-21.
  requirements:
  - earthaccess
  - xarray
  - netCDF4
  - h5netcdf
  - matplotlib
  code: |
    import earthaccess
    import matplotlib.pyplot as plt
    import xarray as xr

    earthaccess.login()                              # NASA Earthdata Login (free account), interactive
    results = earthaccess.search_data(short_name="VNP02MOD", temporal=("2024-06-01", "2024-06-01"),
                                      bounding_box=(12.0, 41.0, 13.0, 42.5), count=1)
    print(len(results), "granule(s)")
    files = earthaccess.download(results, "data")

    ds = xr.open_dataset(files[0], group="observation_data")
    print(list(ds.data_vars)[:30])
    da = ds["M15"]                                   # brightness temperature, 10.76 um (K)
    da[::4, ::4].plot(cmap="gray_r", robust=True)
    plt.title("VIIRS M15 brightness temperature")
    plt.show()
- title: Original Method
  lang: bash
  description: Collection 2 (5200) archive of VNP02MOD. VJ102MOD (NOAA-20) and VJ202MOD (NOAA-21) are
    in the same archive.
  code: |
    # NASA LAADS DAAC (needs an Earthdata token: https://ladsweb.modaps.eosdis.nasa.gov/profile/#app-keys)
    TOKEN="YOUR_EARTHDATA_TOKEN"
    wget -e robots=off -m -np -nH --cut-dirs=4 -A ".nc" \
      --header "Authorization: Bearer $TOKEN" \
      "https://ladsweb.modaps.eosdis.nasa.gov/archive/allData/5200/VNP02MOD/2024/153/" -P data
