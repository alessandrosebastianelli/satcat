mission_name: JPSS (Suomi NPP, NOAA-20, NOAA-21)
sensor_name: ATMS (Advanced Technology Microwave Sounder)
agency: NOAA / NASA
mission_family: JPSS
status: Active
launch_year: 2011
end_of_life_year: null
short_description: 22-channel microwave sounder (23.8-183 GHz) combining AMSU-A and MHS functions; 16-75
  km footprints, 2300 km swath.
long_description: ATMS merges the temperature sounding of AMSU-A and the humidity sounding of MHS into
  one instrument with 22 channels and a wider swath, flying with CrIS on JPSS. Suomi NPP (2011) data delivery
  ceased on 2 November 2026 per NASA Earthdata, so the long-term records come from NOAA-20 (2017) and
  NOAA-21 (2022); JPSS-3 and JPSS-4 are planned.
instrument_type: Passive microwave sounder (22 channels)
orbit_type: LEO sun-synchronous (about 824 km, 13:30 ascending node)
