notes: 'Earth Engine collections: NOAA/GOES/NN/MCMIPF (NN = satellite number) (full disc), MCMIPC (CONUS),
  MCMIPM (mesoscale) and FDCF/FDCC for fire. CMI values need scale and offset.'
known_limitations: Product versions differ between satellites; check quality flags (DQF) for each band.
example_use_cases: True-colour and RGB composites; fire and smoke; SST and LST nowcasting.
