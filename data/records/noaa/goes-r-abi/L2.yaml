snippets:
- title: Python
  lang: python
  description: Reads one full-disc cloud and moisture imagery file (band 13) from the public NOAA bucket
    on AWS (no credentials) and plots it.
  requirements:
  - s3fs
  - xarray
  - h5netcdf
  - matplotlib
  - numpy
  code: |
    import datetime as dt

    import matplotlib.pyplot as plt
    import numpy as np
    import s3fs
    import xarray as xr

    fs = s3fs.S3FileSystem(anon=True)                # public NOAA bucket, no credentials needed
    BUCKET = "noaa-goes19"                               # noaa-goes16, noaa-goes18, noaa-goes19 (GOES-17 until 2023)
    PRODUCT = "ABI-L2-CMIPF"                             # F = full disk, C = CONUS, M = mesoscale
    day = dt.datetime(2025, 6, 1, 12)
    prefix = "%s/%s/%s/%s/%s/" % (BUCKET, PRODUCT, day.strftime("%Y"), day.strftime("%j"), day.strftime("%H"))
    files = [f for f in fs.ls(prefix) if "C13_G" in f]
    print(len(files), "files in", prefix)
    if not files:
        raise SystemExit("No files: check the bucket (satellite) and the date")

    with fs.open(files[0]) as fobj:
        ds = xr.open_dataset(fobj, engine="h5netcdf").load()
    print(ds)

    cmi = ds["CMI"]
    cmi[::4, ::4].plot(cmap="gray_r", robust=True)    # band 13 brightness temperature (K) on the ABI fixed grid
    plt.title("GOES ABI CMI band 13 (10.3 um)")
    plt.show()
- title: Google Earth Engine
  lang: javascript
  description: Brightness temperature of band 13 over the contiguous US (2 km, every 10 minutes). Scale
    and offset are read from each image's properties.
  code: |
    // GOES-16 ABI Cloud and Moisture Imagery, CONUS (band 13, 10.3 um). GOES-19 replaced GOES-16 from 7 April 2025 (NOAA/GOES/19/...).
    var ic = ee.ImageCollection("NOAA/GOES/16/MCMIPC").filterDate("2020-07-29T12:00", "2020-07-29T13:00");
    var im = ee.Image(ic.first());
    // bands 7-16 are brightness temperature: apply the per-image scale and offset
    var bt = im.select("CMI_C13").multiply(ee.Number(im.get("CMI_C13_scale"))).add(ee.Number(im.get("CMI_C13_offset")));
    Map.setCenter(-98, 38, 4);
    Map.addLayer(bt, {min: 200, max: 320, palette: ["white", "black"]}, "GOES-16 band 13 (K)");
- title: Original Method
  lang: bash
  description: Public NOAA buckets on AWS. Other L2 products have their own prefix (for example ABI-L2-ACMF
    cloud mask, ABI-L2-FDCF fire).
  code: |
    aws s3 ls --no-sign-request s3://noaa-goes19/ABI-L2-CMIPF/2025/152/12/
    aws s3 cp --no-sign-request s3://noaa-goes19/ABI-L2-CMIPF/2025/152/12/ . --recursive --exclude "*" --include "*C13_G19*"
