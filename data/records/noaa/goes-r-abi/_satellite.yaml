short_description: '16-channel geostationary imager: full disc every 10 minutes (CONUS 5 minutes, mesoscale
  1 minute) at 0.5-2 km; GOES-19 is GOES-East and GOES-18 is GOES-West.'
long_description: ABI is the main imager of the GOES-R series (GOES-16 launched 2016, GOES-17 2018, GOES-18
  2022, GOES-19 2024). It scans the Western Hemisphere in 16 channels with 0.5 km (red), 1 km and 2 km
  sampling. GOES-19 became GOES-East on 7 April 2025 (replacing GOES-16) and GOES-18 is GOES-West; GOES-17
  is no longer operational. ABI is similar to FCI on MTG and AHI on Himawari, which allows consistent
  multi-satellite products.
