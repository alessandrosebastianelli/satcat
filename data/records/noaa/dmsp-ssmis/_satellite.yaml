mission_name: DMSP (Defense Meteorological Satellite Program)
sensor_name: SSMIS (Special Sensor Microwave Imager/Sounder)
agency: US Space Force / NOAA
mission_family: DMSP
status: Retired
launch_year: 2003
end_of_life_year: 2026
short_description: 24-channel conical-scanning microwave imager/sounder (19-183 GHz) on DMSP F16-F19;
  key source of passive microwave sea ice, wind and precipitation records. The programme is being retired.
long_description: 'SSMIS combines imaging channels (19, 22, 37, 91 GHz) and sounding channels (50-60 GHz
  temperature, 150/183 GHz humidity) with a 1700 km conical swath and continues the SSM/I record since
  1987. DMSP data delivery has been progressively reduced: gaps began in 2025, and the Department of Defense
  agreed to continue processing SSMIS data until the sensor fails or the programme formally ends, planned
  for September 2026. Check NOAA, NASA and NSIDC notices for the current availability; sea-ice records
  are being continued with AMSR2.'
instrument_type: Passive microwave imager/sounder (24 channels, conical scan)
orbit_type: LEO sun-synchronous (about 850 km, dawn-dusk / early morning orbits)
