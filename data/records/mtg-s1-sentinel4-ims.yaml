short_description: >-
  Meteosat Third Generation Sounder satellite, hosting the Copernicus
  Sentinel-4 atmospheric composition instrument plus an infrared sounder.
long_description: >-
  MTG-S1 is the sounder counterpart to the MTG-I imaging satellites,
  carrying two payloads: the Infrared Sounder (IRS), providing
  hyperspectral vertical profiles of temperature and humidity for
  improved short-term forecasting, and Sentinel-4/UVN, the Copernicus
  atmospheric composition instrument monitoring trace gases (NO2, O3,
  SO2, aerosols) hourly over Europe from geostationary orbit — the
  geostationary counterpart to Sentinel-5P's polar-orbit coverage.
